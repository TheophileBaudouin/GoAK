# CI — the KitV2 verification gate, machine-enforced.
# Any non-zero exit fails the job. It mirrors the local gate: metaproject
# validators, router checks, Go gate, probes, and the routing-quality gate.
name: gate

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (supply-chain hardening: tags
      # can be repointed). SHAs resolved from the release tags below.
      # checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Explicit go-version, not go-version-file: gosec v2.28.0 requires
      # go >= 1.25.8 while go.mod declares 1.25.6. '1.26' matches the local
      # maintainer toolchain (go1.26.5) used by the validation gate.
      # setup-go v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26"
          cache: true

      # Validators and the router builder are Python (stdlib + PyYAML, pinned
      # in .agent/validators/requirements.txt); the routing-quality gate
      # needs Node >= 23.6 (native .ts type stripping).
      - name: Install validator dependencies
        run: >-
          python3 -m pip install --quiet
          -r .agent/validators/requirements.txt
      # setup-python v5.6.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      # setup-node v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      # gosec/govulncheck are not provided by setup-go; pinned to audited
      # releases so CI matches what the local gate uses.
      - name: Install gate tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      # ---- metaproject validators (structure + registry gates) ----
      - name: validate-instructions
        run: python3 .agent/validators/validate-instructions.py

      - name: validate-cognitive
        run: python3 .agent/validators/validate-cognitive.py

      - name: product validator
        working-directory: KitV2
        run: python3 tools/validators/validate-kitv2.py

      - name: router index check
        run: python3 .agent/router/build_index.py --check

      - name: routing-quality gate (real runtime scoring)
        run: node --no-warnings .agent/router/run_scenarios.mjs

      - name: UI routing-quality gate (real runtime scoring, Z13)
        run: node --no-warnings .agent/router/run_ui_scenarios.mjs

      - name: router gate tests (tripwires + validator checks)
        working-directory: .agent/router
        run: PYTHONPATH=.. python3 -m unittest discover -q

      - name: product validator tests
        working-directory: KitV2/tools/validators
        run: python3 -m unittest discover -q

      - name: structure.md generator tests
        working-directory: KitV2/tools/generators
        run: python3 -m unittest discover -q

      # ---- Go gate (from KitV2) ----
      - name: gofmt
        working-directory: KitV2
        run: test -z "$(gofmt -l .)"

      - name: go vet
        working-directory: KitV2
        run: go vet ./...

      - name: go mod verify
        working-directory: KitV2
        run: go mod verify

      # golangci-lint-action v2.12.2
      - name: golangci-lint
        uses: >-
          golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.12.2
          working-directory: KitV2

      # The coverage aggregate measures the testable library surface
      # (recipes, snippets, tools/offline) — D-2026-08-06-13. The probe
      # mains are executable observable scenarios verified by probes/run.sh
      # below, not unit-testable library code; counting them at 0% would
      # make the floor uninformative.
      - name: go test -race (library surface)
        working-directory: KitV2
        run: >-
          go test -race -coverprofile=coverage.out
          $(go list ./... | grep -v '/probes/')

      - name: coverage floor (70%)
        working-directory: KitV2
        run: |
          pct=$(go tool cover -func=coverage.out | tail -1 \
            | grep -oE '[0-9]+\.[0-9]+%$' | tr -d '%')
          echo "aggregate coverage: ${pct}% (floor: 70%)"
          awk -v p="$pct" 'BEGIN { exit !(p+0 >= 70) }'

      - name: probes (observable scenarios)
        working-directory: KitV2
        run: bash probes/run.sh

      - name: gosec
        working-directory: KitV2
        run: gosec ./...

      - name: govulncheck
        working-directory: KitV2
        run: govulncheck ./...
