  - id: source:go:toolchain
    title: Official Go toolchain
    kind: Source
    version: pinned-go-version
    status: active
    owner: go-agent-kit
    tags: [go, official, toolchain, validation, offline]
    go_version: "1.25+"
    dependencies: []
    last_verified: 2026-08-03
    retrieval_units:
      - gofmt
      - go-test
      - benchmark
      - fuzzing
      - race
      - go-vet
      - pprof
      - trace
    offline_resolver: "go help, go doc, and pinned GOROOT source paths"
    transformations:
      capabilities:
        - capability:go:toolchain-format
        - capability:go:toolchain-test
        - capability:go:toolchain-vet
        - capability:go:toolchain-benchmark
        - capability:go:toolchain-fuzz
        - capability:go:toolchain-race
        - capability:go:toolchain-pprof
        - capability:go:toolchain-trace
      evaluations:
        - evaluation:go:format
        - evaluation:go:static-analysis
        - evaluation:go:tests
        - evaluation:go:concurrency
        - evaluation:go:performance
    mapping:
      gofmt: "GOROOT/src/cmd/gofmt/doc.go; go help fmt"
      go-test: "go help test; go help testflag"
      benchmark: >-
        go help testflag (-bench, -benchtime, -benchmem); go doc testing.B
      fuzzing: "go help testflag (-fuzz, -fuzztime); go doc testing.F"
      race: >-
        go help build (-race); local GOROOT race sources when present; a pinned
        official race-detector source unit may be required
      go-vet: "go help vet"
      pprof: "GOROOT/src/cmd/pprof/doc.go; runtime/pprof"
      trace: "GOROOT/src/cmd/trace/doc.go; runtime/trace"
    remains_source_only:
      - "tool implementation internals"
      - "full command documentation when only one flag is needed"
    target_status:
      pattern:distribution:bootstrap-cli-runtime:
        status: proposed
      capability:go:toolchain-format:
        status: proposed
      capability:go:toolchain-test:
        status: proposed
      capability:go:toolchain-vet:
        status: proposed
      capability:go:toolchain-benchmark:
        status: proposed
      capability:go:toolchain-fuzz:
        status: proposed
      capability:go:toolchain-race:
        status: proposed
      capability:go:toolchain-pprof:
        status: proposed
      capability:go:toolchain-trace:
        status: proposed
      evaluation:go:format:
