schema: go-agent-kit-technology-documentation/1
scope: metaproject-only
authority: .agent/sources/Go-dev-kit-sources-et-references.md
policy:
  official_source_priority:
    - official-documentation
    - official-llm-documentation
    - official-complementary-reference
    - official-annex-guide
  local_content: metadata-and-bounded-source-units
  forbidden:
    - full-document-preload
    - undocumented-product-doctrine
    - copying-this-policy-into-KitV2
  retrieval:
    network_default: false
    source_body: content-addressed-and-pinned
    context: metadata-first-and-atomic
metadata:
  required:
    - technology
    - project
    - version
    - retrieved_at
    - upstream_updated_at
    - official_urls
    - license
