---
name: go-agent-kit-v2
version: 2.5.0
status: standalone
capabilities:
  rules:
    source: rules/
    status: complete
    criteria: >-
      13 rule modules, each with an imperative, an explicit boundary, a
      verification path, and primary sources; frontmatter validated by the
      gate.
  knowledge:
    source: knowledge/
    status: catalog-and-sources
    criteria: every knowledge YAML carries full metadata (Z10) with resolved
      relationships; stdlib entries are pointer-only and resolved offline.
  recipes:
    source: recipes/
    status: complete
    criteria: 15 recipes with importable Go code, targeted tests, an executed
      observable scenario with an explicit verdict, limits, and primary sources.
  snippets:
    source: snippets/
    status: complete-catalog
    criteria: 3 snippets with a resolved canonical source and a check.sh that
      compiles and executes; no snippet introduces new knowledge.
  templates:
    source: templates/
    status: sourced-mit-projects
    criteria: 3 sourced MIT templates compile, pass their tests, and ship
      LICENSE, ATTRIBUTION.md (source, version, adaptations, technical scope),
      README, and template.yaml.
  product-verification:
    source: probes/
    status: deterministic-probes-and-checks
    criteria: 15 probes, each ending with an explicit PASS verdict and exit
      code; run.sh discovers them by glob and never lists them by hand.
  pi-workflows:
    source: .pi/
    status: partial
    criteria: 3 prompts with an activation description and 8 workflow skills
      with complete frontmatter; prompts and skills keep disjoint roles.
  go-probes:
    source: probes/
    status: deterministic-probes-and-checks
    criteria: probes import the recipes they verify (composition, not
      duplication) and run without network or an LLM.
  source-registry:
    source: knowledge/
    status: sourced-pointers-and-bundle
    criteria: catalog pointers carry primary source URLs with dated evidence;
      the offline bundle manifest and checksums are verified by the gate.
  offline-source-retrieval:
    source: tools/offline/
    status: self-contained-pinned-bundle-and-deterministic-resolver
    criteria: the resolver verifies SHA-256 content, bounds excerpts, and
      returns blocked instead of fabricating unavailable knowledge.
  resource-routing:
    source: router/
    status: generated-read-only-index-and-native-pi-tool
    criteria: >-
      index.json matches meta.json checksum and covers every indexable
      resource; the runtime tool is read-only; routing quality is contract-
      tested by scenarios.json under the real runtime scoring (metaproject
      node gate), so the top resource for each documented intent stays
      verifiable as the kit grows.
coverage:
  product_skills: 73
  rules: 14
  recipes: 15
  # 44 = catalog SKILL.md fiches; router meta.json counts all catalog-kind
  # resources (75, incl. YAML pointers) — two scopes, both recomputed by gate.
  knowledge_catalogs: 44
  probes: 15
  project_templates: 3
metadata_role: product capability catalog, not an instruction entrypoint
known_limits:
  - id: pi-discovery-smoke-test
    impact: >-
      Pi discovery was smoke-tested from a trusted temporary consumer copy;
      individual skill invocation remains separate and is not covered by an
      automated probe.
    status: open
  - id: gui-tty-external-system-tests
    impact: >-
      Wails and interactive TUI probes verify service/model boundaries; full
      GUI webview and TTY host rendering remain external system tests.
    status: accepted
  - id: offline-pinned-sources
    impact: >-
      Effective Go is pinned in the shipped bundle; pkg.go.dev and toolchain
      units resolve from the local pinned Go toolchain.
    status: accepted
  - id: router-read-only-by-design
    impact: >-
      Consumers never rebuild the router index; it is regenerated in the
      metaproject and shipped read-only by design.
    status: accepted
