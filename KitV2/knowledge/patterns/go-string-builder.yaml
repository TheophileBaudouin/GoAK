id: pattern:go:string-builder
title: String building — strings.Builder for loop assembly
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, strings, builder, performance]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Go string immutability makes loop concatenation quadratic (see
  pattern:antipattern:go-string-concat-loop): every `+=` copies the whole
  string.
context: >-
  Applies to any text assembled in several pieces: CSV, dynamic SQL, HTML,
  multiline logs, queries.
solution: >-
  `var b strings.Builder` + `b.WriteString(part)`; preallocate with
  `b.Grow(n)` when the size is known; `strings.Join` for fixed separators;
  `bytes.Buffer` for binary. Build then convert once (`b.String()`).
benefits: >-
  Amortizes reallocation (linear cost instead of quadratic), zero
  intermediate allocation of the whole string, trivial API.
costs: >-
  For 2-3 fixed concatenations (`a + b + c`), the builder is noise without a
  measurable gain — the rule targets loops and hot paths.
related: >-
  Negative counterpart: pattern:antipattern:go-string-concat-loop.
relationships:
  references:
    - https://go.dev/blog/strings
    - https://pkg.go.dev/strings
    - pattern:antipattern:go-string-concat-loop
