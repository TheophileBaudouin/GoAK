id: pattern:go:contextual-worker
title: Contextual worker — goroutine with an explicit exit condition
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, concurrency, goroutine, context, cancellation]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Starting a goroutine is trivial; stopping it cleanly is not. Without an
  exit condition, goroutines leak (memory, stack) until OOM.
context: >-
  Applies to any goroutine whose lifetime exceeds the function that starts
  it: worker, pipeline, poller, long-running handler.
solution: >-
  Give each goroutine a `context.Context` for cancellation and an explicit
  select: `select { case <-ctx.Done(): return; case <-jobs: … }`. The
  launcher creates `ctx, cancel := context.WithCancel(parent)`, calls
  `cancel()` in its `defer`, and waits for completion (WaitGroup/errgroup)
  before returning.
benefits: >-
  Goroutines have a bounded, verifiable lifetime; cancellation propagates to
  blocking calls; the test can simulate shutdown by cancelling the context
  (see pattern:go:concurrency-worker-pool for grouping).
costs: >-
  Cost of one extra select and channel; forgetting a `cancel()` leaks
  cancellation (see pattern:go:private-context-keys for values).
related: >-
  Kit rules: `rules/core/concurrency` (goroutine lifetimes, cancellation).
  Recipes: recipe-worker-pool, recipe-graceful-shutdown. Negative
  counterpart: pattern:antipattern:go-goroutine-leak.
relationships:
  references:
    - https://go.dev/blog/pipelines
    - https://pkg.go.dev/context
    - pattern:antipattern:go-goroutine-leak
  uses: []
