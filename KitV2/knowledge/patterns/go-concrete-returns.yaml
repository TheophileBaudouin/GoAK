id: pattern:go:concrete-returns
title: Concrete returns, consumer-side interfaces
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, interfaces, api, design]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  A function that returns an interface forces all its callers into an
  abstraction, often for a single implementation — indirection without
  benefit (see pattern:antipattern:go-interface-everywhere).
context: >-
  Applies to package APIs: constructors, factories, services that expose
  concrete implementations to their consumers.
solution: >-
  Return the concrete type (`*Store`, `*Client`); define a minimal interface
  where it is consumed, with the methods actually used, only when a mock or a
  second implementation is justified. Verify conformance at compile time:
  `var _ Interface = (*Concrete)(nil)`.
benefits: >-
  API simple to understand and extend, no unnecessary virtual dispatch cost,
  and the freedom to vary the abstraction on the side that needs it.
costs: >-
  The consumer cannot substitute an implementation without an interface
  (acceptable when only one exists); a concrete return creates type coupling
  — weigh it for genuinely stable boundaries.
related: >-
  Kit rules: `rules/core/philosophy`. Negative counterpart:
  pattern:antipattern:go-interface-everywhere.
relationships:
  references:
    - https://100go.co/
    - https://go.dev/wiki/CodeReviewComments
    - pattern:antipattern:go-interface-everywhere
  uses: []
