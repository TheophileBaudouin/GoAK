id: pattern:concurrency:singleflight
title: Singleflight — merge identical concurrent calls
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, concurrency, singleflight, cache, stampede]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  N simultaneous requests miss a cache at the same instant and all hit the
  source (see pattern:antipattern:cache-stampede): multiplied load and
  latency spikes.
context: >-
  Applies to any expensive computation or fetch shared between goroutines of
  the same process: cache miss, access token, remote configuration.
solution: >-
  `golang.org/x/sync/singleflight`: `g.Do(key, fn)` guarantees that only one
  execution of `fn` per key is in flight, the other goroutines share the
  result. Combine with a cache (miss → singleflight → populate) to absorb
  spikes.
benefits: >-
  The source receives only one call per miss window; reduced latency for
  waiting callers; trivial and testable implementation.
costs: >-
  Merging is per-process only (not inter-node — a distributed lock or Redis
  would be needed); the first request remains paid, and a failure is shared
  by all (callers must retry).
related: >-
  Negative counterpart: pattern:antipattern:cache-stampede.
relationships:
  references:
    - https://pkg.go.dev/golang.org/x/sync/singleflight
    - https://redis.io/blog/cache-consistency-strategies/
    - pattern:antipattern:cache-stampede
  uses: []
  validated_by: []
