id: pattern:observability:structured-logging
title: Structured logging — slog as the standard interface
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [observability, logging, slog, structured]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Free-form text logs (fmt.Printf) are neither filterable, nor
  correlatable, nor queryable at scale — and noise destroys value (see
  pattern:antipattern:obs-excessive-logging).
context: >-
  Applies to any program that logs exploitable events (operations, errors,
  startups), especially deployed ones.
solution: >-
  `log/slog` (Go 1.21+): typed keys/values (`slog.Info("started", "port",
  p)`), levels (debug/info/warn/error), replaceable handlers (text, JSON,
  or charm colored log — catalog log). The kit rule: Error = failure,
  explicit context per call, never message concatenation.
benefits: >-
  Queryable logs (JSON → collection tool), context added without fragile
  formatting, a standard interface avoiding third-party logger lock-in.
costs: >-
  A slog line costs one allocation per key (negligible outside ultra-hot
  paths); messages must stay concise — aggregation and volume are managed
  by level, not by more text.
related: >-
  Kit rules: `rules/registry/logging`. Catalog: log
  (knowledge/catalogs/libraries/log). Negative counterpart:
  pattern:antipattern:obs-excessive-logging.
relationships:
  references:
    - https://go.dev/blog/slog
    - https://pkg.go.dev/log/slog
    - pattern:antipattern:obs-excessive-logging
  uses: []
  validated_by: []
