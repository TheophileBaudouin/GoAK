id: pattern:testing:fakes-over-mocks
title: Role-based fakes over interaction mocks
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, testing, fakes, mocks, test-doubles]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Interaction mocks freeze the internal API, make tests fragile, and verify
  expectations rather than contracts (see
  pattern:antipattern:test-over-mocking).
context: >-
  Applies to a test's dependencies: repository, HTTP client, clock — only
  at the unstable boundary.
solution: >-
  Use the role-based test double taxonomy (Meszaros): **fake** (functional
  in-memory implementation, e.g. a map-backed repo), **stub** (fixed
  responses), **spy** (records and replays) — preferring fakes over mocks
  (state verification, not interaction). For HTTP: `httptest.Server` (see
  pattern:testing:httptest). Mock frameworks (mockery, testify/mock) are
  justified only for genuinely unstable interfaces.
benefits: >-
  Tests stable under internal refactoring, contracts verified on real data,
  less double configuration — and fakes are reusable.
costs: >-
  A fake is code to maintain (keep it as simple as possible); it must
  reflect the real contract, otherwise it creates false confidence (a
  minimal integration test remains necessary).
related: >-
  Kit rules: `rules/registry/testing`. Recipe: recipe-sqlite-sqlc
  (real database in tests). Negative counterpart:
  pattern:antipattern:test-over-mocking.
relationships:
  references:
    - http://xunitpatterns.com/Mock%20Object.html
    - https://go.dev/wiki/CodeReviewComments
    - pattern:antipattern:test-over-mocking
