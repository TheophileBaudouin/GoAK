id: pattern:resilience:retry-backoff-jitter
title: Retry avec backoff exponentiel et jitter
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [resilience, retry, backoff, jitter]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Les erreurs transitoires (timeout, 5xx, connexion) sont fréquentes ; sans
  retry le système est fragile, avec une retry agressive il s'effondre
  (voir pattern:antipattern:msg-retry-storm).
context: >-
  S'applique aux appels réseau vers des services qui peuvent échouer
  temporairement, en distinguant les erreurs transitoires des erreurs
  définitives (4xx, validation).
solution: >-
  Retry bornée : petit nombre de tentatives (2-3), délai exponentiel
  (`base * 2^n`), **jitter aléatoire** pour désynchroniser les clients,
  et arrêt immédiat sur erreur définitive ou `ctx.Done()`. Respecter
  `Retry-After`/429. Combiner avec timeouts (voir
  pattern:resilience:timeout-deadlines) et circuit breaker.
benefits: >-
  Les pannes transitoires passent inaperçues, la charge de reprise reste
  lissée (jitter), et l'échec définitif est rapide.
costs: >-
  Ajoute de la latence en cas d'échec répété ; une retry sans backoff ni
  plafond transforme une panne en déluge — c'est le jitter et la borne qui
  font la différence.
related: >-
  Homologue négatif : pattern:antipattern:msg-retry-storm.
relationships:
  references:
    - https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/retry-backoff.html
    - pattern:antipattern:msg-retry-storm
  uses: []
  validated_by: []
