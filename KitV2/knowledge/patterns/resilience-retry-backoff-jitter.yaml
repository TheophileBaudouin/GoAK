id: pattern:resilience:retry-backoff-jitter
title: Retry with exponential backoff and jitter
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [resilience, retry, backoff, jitter]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Transient errors (timeout, 5xx, connection) are frequent; without retry
  the system is fragile, with aggressive retry it collapses (see
  pattern:antipattern:msg-retry-storm).
context: >-
  Applies to network calls to services that can fail temporarily,
  distinguishing transient errors from definitive ones (4xx, validation).
solution: >-
  Bounded retry: a small number of attempts (2-3), exponential delay
  (`base * 2^n`), **random jitter** to desynchronize clients, and immediate
  stop on a definitive error or `ctx.Done()`. Honor `Retry-After`/429.
  Combine with timeouts (see pattern:resilience:timeout-deadlines) and
  circuit breaker.
benefits: >-
  Transient failures go unnoticed, recovery load stays smoothed (jitter),
  and definitive failure is fast.
costs: >-
  Adds latency on repeated failure; retry without backoff or cap turns an
  outage into a deluge — jitter and the bound are what make the difference.
related: >-
  Negative counterpart: pattern:antipattern:msg-retry-storm.
relationships:
  references:
    - https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/retry-backoff.html
    - pattern:antipattern:msg-retry-storm
  uses: []
  validated_by: []
