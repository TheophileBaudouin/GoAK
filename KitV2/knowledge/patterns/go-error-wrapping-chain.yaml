id: pattern:go:error-wrapping-chain
title: Error chain — wrap with %w and inspect with errors.Is/As
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, errors, wrapping, is, as]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  An error propagated without context loses its origin: impossible to know
  which operation failed (which repository, which network call) once at the
  top of the stack.
context: >-
  Applies as soon as a function adds information to an error before
  propagating it (service layer, handler, adapter) or when a caller must
  distinguish the cause of a failure.
solution: >-
  Propagate with `fmt.Errorf("operate %s: %w", id, err)` keeping the chain
  (`%w`), inspect with `errors.Is(err, sentinel)` for identity and
  `errors.As` for the type. Do not wrap at every layer: a single contextual
  annotation per boundary, without "wrapitis".
benefits: >-
  The cause stays inspectable at every level, the message is readable, and
  code decisions (retry, HTTP mapping) rely on Is/As rather than strings
  (see pattern:go:sentinel-errors).
costs: >-
  Per-wrap cost (formatting) negligible; the original error is no longer
  directly comparable to a sentinel without `errors.Is`. Too many wraps make
  messages verbose — bound to one annotation per boundary.
related: >-
  Kit rules: `rules/core/errors` (handle-once, sentinel/typed/opaque).
  Negative counterparts: pattern:antipattern:go-error-string-matching and
  pattern:antipattern:go-ignored-error.
relationships:
  references:
    - https://go.dev/blog/errors-are-values
    - https://pkg.go.dev/errors
    - pattern:antipattern:go-error-string-matching
    - pattern:antipattern:go-ignored-error
  uses: []
  validated_by: []
