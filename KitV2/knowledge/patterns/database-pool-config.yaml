id: pattern:database:pool-config
title: Explicit and measured connection pool
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [database, sql, pool, connection]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Pool defaults (unlimited connections, never recycled, leaks) exhaust the
  DBMS or freeze the application under load (see
  pattern:antipattern:db-pool-misconfig).
context: >-
  Applies to any application that opens a `*sql.DB`: server, worker,
  processing CLI.
solution: >-
  Configure explicitly after `sql.Open`: `SetMaxOpenConns` (bounded
  according to the DBMS and the app), `SetMaxIdleConns` (≤ MaxOpen),
  `SetConnMaxIdleTime` and `SetConnMaxLifetime` (recycling). Monitor with
  `db.Stats()` (InUse, Idle, WaitCount) under test load and adjust by
  measurement.
benefits: >-
  Predictable load on the DBMS, recycled connections (no zombie after
  failover/firewall), and leak detection via the stats.
costs: >-
  A too-low MaxOpen creates wait queues (WaitCount rising); the right values
  depend on the DBMS and the access profile — the rule is to set and measure
  them, not a universal value.
related: >-
  Recipe: recipe-sqlite-sqlc. Negative counterpart:
  pattern:antipattern:db-pool-misconfig.
relationships:
  references:
    - https://pkg.go.dev/database/sql
    - pattern:antipattern:db-pool-misconfig
  uses: []
  validated_by: []
