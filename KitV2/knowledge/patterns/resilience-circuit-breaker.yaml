id: pattern:resilience:circuit-breaker
title: Circuit breaker — fail fast to isolate a dependent
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [resilience, circuit-breaker, availability]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  A failing dependent still receives every request despite its failures:
  callers wait for timeouts, threads/goroutines exhaust, and the failure
  propagates (see pattern:antipattern:msg-retry-storm).
context: >-
  Applies to calls to critical third-party or internal services, when
  failing fast beats waiting systematically.
solution: >-
  Interpose one breaker per dependency: closed state (normal calls) → after
  a failure threshold, open state (immediate failure without calling) →
  after a cooldown period, half-open state (a few probe calls) → closed on
  success. In Go: a dedicated library (sony/gobreaker, cenkalti/backoff) or
  a minimal implementation with a counter + mutex.
benefits: >-
  The failing dependent is relieved (no deluge), callers recover
  immediately, and the system degrades cleanly during the outage.
costs: >-
  State and threshold complexity (tune by measurement); a breaker without
  strict upstream timeouts is ineffective — compose it with
  pattern:resilience:timeout-deadlines and retry.
related: >-
  Negative counterpart: pattern:antipattern:msg-retry-storm.
relationships:
  references:
    - https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/circuit-breaker.html
    - https://microservices.io/patterns/reliability/circuit-breaker.html
    - pattern:antipattern:msg-retry-storm
  uses: []
