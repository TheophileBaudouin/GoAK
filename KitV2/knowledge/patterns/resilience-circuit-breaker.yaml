id: pattern:resilience:circuit-breaker
title: Circuit breaker — échec rapide pour isoler un dépendant
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [resilience, circuit-breaker, availability]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Un dépendant en panne reçoit toutes les requêtes malgré ses échecs : les
  appelants attendent des timeouts, les threads/goroutines s'épuisent, et la
  panne se propage (voir pattern:antipattern:msg-retry-storm).
context: >-
  S'applique aux appels vers des services tiers ou internes critiques, quand
  l'échec rapide vaut mieux que l'attente systématique.
solution: >-
  Interposer un breaker par dépendance : état fermé (appels normaux) → après
  un seuil d'échecs, état ouvert (échec immédiat sans appeler) → après un
  délai de refroidissement, état demi-ouvert (quelques appels de sonde) →
  fermé si succès. En Go : bibliothèque dédiée (sony/gobreaker, cenkalti/
  backoff) ou implémentation minimaliste avec compteur + mutex.
benefits: >-
  Le dépendant défaillant est délesté (pas de déluge), les appelants
  récupèrent immédiatement, et le système dégrade proprement pendant la
  panne.
costs: >-
  Complexité d'état et de seuils (à régler par mesure) ; un breaker sans
  timeouts stricts en amont est inefficace — le composer avec
  pattern:resilience:timeout-deadlines et retry.
related: >-
  Homologue négatif : pattern:antipattern:msg-retry-storm.
relationships:
  references:
    - https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/circuit-breaker.html
    - https://microservices.io/patterns/reliability/circuit-breaker.html
    - pattern:antipattern:msg-retry-storm
