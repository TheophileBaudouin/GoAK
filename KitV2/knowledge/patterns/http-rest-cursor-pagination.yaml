id: pattern:http:rest-cursor-pagination
title: Pagination par curseur — listes stables et bornées
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [http, rest, api, pagination, cursor]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Une collection non paginée dégénère en réponses énormes ; la pagination par
  offset dérive quand les données changent entre pages (voir
  pattern:antipattern:api-no-pagination).
context: >-
  S'applique à tout endpoint de liste sur des données qui changent ou peuvent
  grossir (recommandé par défaut pour les API externes).
solution: >-
  Pagination par curseur : paramètre `cursor` (opaque, encodé), requête
  `WHERE (sort_key, id) > (?, ?) ORDER BY sort_key, id LIMIT n+1`, réponse
  avec `next_cursor` (ou RFC 8288 `Link` header). Le curseur fige la position
  : pas de dérive si des lignes sont insérées/supprimées entre pages.
benefits: >-
  Listes stables sous écritures concurrentes, pages de taille fixe, requêtes
  indexées (pas de OFFSET coûteux), et navigation avant/arrière simple.
costs: >-
  Impossible d'accéder directement à la page n (le curseur est opaque) ;
  exige une clé de tri unique stable (id) ; les besoins « aller à la page 5 »
  d'un admin restent en offset.
related: >-
  Homologue négatif : pattern:antipattern:api-no-pagination.
relationships:
  references:
    - https://github.com/microsoft/api-guidelines
    - https://www.rfc-editor.org/rfc/rfc8288
    - pattern:antipattern:api-no-pagination
  uses: []
  validated_by: []
