id: pattern:http:rest-cursor-pagination
title: Cursor pagination — stable and bounded lists
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [http, rest, api, pagination, cursor]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  An unpaginated collection degenerates into huge responses; offset
  pagination drifts when data changes between pages (see
  pattern:antipattern:api-no-pagination).
context: >-
  Applies to any list endpoint over data that changes or can grow
  (recommended by default for external APIs).
solution: >-
  Cursor pagination: `cursor` parameter (opaque, encoded), query
  `WHERE (sort_key, id) > (?, ?) ORDER BY sort_key, id LIMIT n+1`, response
  with `next_cursor` (or RFC 8288 `Link` header). The cursor freezes the
  position: no drift if rows are inserted/deleted between pages.
benefits: >-
  Stable lists under concurrent writes, fixed-size pages, indexed queries
  (no costly OFFSET), and simple forward/backward navigation.
costs: >-
  Direct access to page n is impossible (the cursor is opaque); requires a
  unique stable sort key (id); the admin "go to page 5" need remains
  offset-based.
related: >-
  Negative counterpart: pattern:antipattern:api-no-pagination.
relationships:
  references:
    - https://github.com/microsoft/api-guidelines
    - https://www.rfc-editor.org/rfc/rfc8288
    - pattern:antipattern:api-no-pagination
  uses: []
  validated_by: []
