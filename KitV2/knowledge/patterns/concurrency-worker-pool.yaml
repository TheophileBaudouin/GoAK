id: pattern:concurrency:worker-pool
title: Worker pool — bounded fan-out with errgroup.SetLimit
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, concurrency, worker, errgroup, backpressure]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Launching one goroutine per task without a limit exhausts memory and
  connections under load (see pattern:antipattern:go-goroutine-leak).
context: >-
  Applies when a batch of independent tasks (items to process, requests to
  emit) must run with capped concurrency.
solution: >-
  `errgroup.Group` with `SetLimit(n)`: the limit bounds the active
  goroutines, `Wait()` propagates the first error, `WithContext` cancels the
  other tasks. Replace a manual worker channel when the only mechanic needed
  is bounded fan-out.
benefits: >-
  Backpressure by construction, propagated and first-error-respecting
  error handling, coordinated cancellation, short and testable code (see
  recipe-worker-pool).
costs: >-
  No built-in queue (excess tasks wait inside the group); for a persistent
  queue or prioritized throughput, a buffered channel or a dedicated worker
  remains necessary.
related: >-
  Kit rules: `rules/core/concurrency` (bounded fan-out). Recipe:
  recipe-worker-pool. Negative counterpart:
  pattern:antipattern:go-goroutine-leak.
relationships:
  references:
    - https://pkg.go.dev/golang.org/x/sync/errgroup
    - https://go.dev/blog/pipelines
