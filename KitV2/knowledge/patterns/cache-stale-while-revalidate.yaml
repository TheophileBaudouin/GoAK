id: pattern:cache:stale-while-revalidate
title: Stale-while-revalidate — freshness without load spikes
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [cache, stale-while-revalidate, performance]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Expiration of a popular entry causes a spike of simultaneous misses
  (stampede, see pattern:antipattern:cache-stampede) and blind invalidation
  serves stale data without control (see pattern:antipattern:cache-stale).
context: >-
  Applies to frequently-read data whose freshness tolerates a drift window
  (content, aggregates, reference data).
solution: >-
  Serve the stale value while an asynchronous revalidation reloads the
  source: short TTL (freshness) + long TTL (maximum validity); the first
  reader after expiration triggers the refresh (locked by
  pattern:concurrency:singleflight) and the others receive the existing
  value. Add jitter to the TTLs to desynchronize expirations.
benefits: >-
  Constant read latency (never a miss that hits the source in mass),
  bounded and controlled freshness, and graceful degradation of the source.
costs: >-
  Complexity (two TTLs, revalidation, refresh state); the served value can
  be stale by the window — unacceptable for critical data (real-time
  prices) where write-through invalidation remains necessary.
related: >-
  Negative counterpart: pattern:antipattern:cache-stampede,
  pattern:antipattern:cache-stale.
relationships:
  references:
    - https://redis.io/blog/cache-consistency-strategies/
    - https://en.wikipedia.org/wiki/Cache_stampede
    - pattern:antipattern:cache-stampede
  uses: []
  validated_by: []
