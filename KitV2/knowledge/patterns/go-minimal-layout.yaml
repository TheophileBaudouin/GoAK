id: pattern:go:minimal-layout
title: Structure minimale — packages par frontière d'import
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, project-structure, layout, internal]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  L'arborescence copiée d'un template générique (cmd/pkg/internal/scripts…)
  crée des packages vides et des couches artificielles pour un petit projet
  (voir pattern:antipattern:go-over-structuring).
context: >-
  S'applique à l'initialisation d'un module et à chaque ajout de package :
  ne structurer que ce qui existe.
solution: >-
  Commencer à la racine du module ; ajouter des packages quand une frontière
  d'import est réelle — `internal/` pour le code privé (le compilateur bloque
  les imports externes), `cmd/` pour les binaires du module. Structurer
  par responsabilité (domaine, transport, storage), pas par copie de layout.
benefits: >-
  Navigation courte, pas de package fourre-tout, frontières vérifiées par le
  compilateur (`internal/`), coût d'entretien minimal.
costs: >-
  La migration vers plus de structure est plus coûteuse que la création
  initiale — un template de démarrage raisonnable (celui du kit) reste une
  base saine, l'anti-pattern est d'en conserver les dossiers vides.
related: >-
  Règles du kit : `rules/core/philosophy`. Homologue négatif :
  pattern:antipattern:go-over-structuring.
relationships:
  references:
    - https://go.dev/doc/modules/layout
    - pattern:antipattern:go-over-structuring
  uses: []
  validated_by: []
