id: pattern:go:minimal-layout
title: Minimal layout — packages by import boundary
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, project-structure, layout, internal]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  The tree copied from a generic template (cmd/pkg/internal/scripts…)
  creates empty packages and artificial layers for a small project (see
  pattern:antipattern:go-over-structuring).
context: >-
  Applies at module initialization and at every package addition: structure
  only what exists.
solution: >-
  Start at the module root; add packages when an import boundary is real —
  `internal/` for private code (the compiler blocks external imports),
  `cmd/` for the module's binaries. Structure by responsibility (domain,
  transport, storage), not by copying a layout.
benefits: >-
  Short navigation, no catch-all package, boundaries enforced by the
  compiler (`internal/`), minimal maintenance cost.
costs: >-
  Migrating to more structure is more expensive than the initial creation —
  a reasonable starter template (the kit's) remains a sound base; the
  anti-pattern is keeping its empty folders.
related: >-
  Kit rules: `rules/core/philosophy`. Negative counterpart:
  pattern:antipattern:go-over-structuring.
relationships:
  references:
    - https://go.dev/doc/modules/layout
    - pattern:antipattern:go-over-structuring
