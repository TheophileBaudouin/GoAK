id: pattern:security:fail-closed-auth
title: Fail closed — deny by default
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [security, authorization, fail-closed]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Access controls whose default allows (or that fail open on error) turn an
  outage into a breach (see pattern:antipattern:sec-fail-open).
context: >-
  Applies to every authentication/authorization decision: middleware, API,
  resource access.
solution: >-
  Deny by default, allow explicitly: `return 403` on any unvalidated path,
  the authorization check is never conditional on a flag, and any
  verification error (IdP unavailable, unreadable token, timeout) is
  treated as a denial with a log. Test the control's error paths explicitly.
benefits: >-
  A failing security component degrades toward denial (reduced
  availability), never toward access (breach) — the only acceptable
  orientation for controls.
costs: >-
  A down IdP blocks access (an availability choice); 'open degraded mode'
  requires a documented product decision and an accepted risk, never a
  default.
related: >-
  Negative counterpart: pattern:antipattern:sec-fail-open.
relationships:
  references:
    - https://owasp.org/Top10/2025/A10_2025-Mishandling_of_Exceptional_Conditions/
    - pattern:antipattern:sec-fail-open
  uses: []
  validated_by: []
