---
id: pattern:security:auth-session-vs-jwt
title: Authentication mechanism choice — cookie sessions vs JWT vs OAuth2
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [security, authentication, sessions, jwt, oauth2, cookies, decision]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-05
problem: >-
  The choice of the auth mechanism drives revocation, CSRF, mobility, and
  complexity. JWT is often chosen by reflex ("stateless") while cookie
  sessions are simpler and revocable for a classic web app; conversely,
  cookie sessions for a mobile API multiply the pitfalls (CORS, CSRF,
  fixation).
context: >-
  Applies when choosing a mechanism for a new application or an endpoint:
  web browser (templates/SPA served), REST API, mobile, or third-party login
  (Google/GitHub/enterprise).
solution: >-
  Choose according to the client and the revocation needs:
  - Classic web app (browser) → **server-side cookie sessions** (`scs`):
    revocable, HttpOnly, SameSite; CSRF mandatory.
  - REST API / mobile / service-to-service → **JWT** (`golang-jwt`):
    stateless, short token (exp) + rotation; never sensitive data in claims.
  - Third-party / enterprise login → **OAuth2/OIDC** (`golang.org/x/oauth2`):
    delegate authentication, never store passwords.
  - Passwords (internal login): memory-hard **argon2id** hash (or bcrypt for
    compatibility) via `golang.org/x/crypto`, never in cleartext or SHA-256.
benefits: >-
  Mechanism aligned with the client (revocability, CSRF, mobility); fewer
  security pitfalls by construction; an explicit, documented decision instead
  of a reflex ("JWT everywhere").
costs: >-
  Mixed needs (SPA + mobile + web) often require two mechanisms (sessions for
  the web, JWT for the API) and careful key/expiration management; OAuth2
  adds the cost of an IdP and of storing local identities.
related: >-
  Negative counterparts: pattern:antipattern:sec-fail-open,
  pattern:antipattern:sec-missing-csrf; see also
  pattern:security:secrets-management.
