id: pattern:messaging:transactional-outbox
title: Transactional outbox — event and state atomic
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [messaging, outbox, transactions, events]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Publishing an event and changing state cannot be atomic directly
  (dual-write): the event is lost if publication fails, or duplicated if the
  transaction is replayed.
context: >-
  Applies to any service that must emit guaranteed events after a state
  change (integrations, event-driven).
solution: >-
  Write the event into an `outbox` table in the **same transaction** as the
  state (see pattern:database:transaction-boundary); a relay (poller or
  CDC) then publishes to the broker and marks the event as published. State
  and publication commitment can no longer diverge.
benefits: >-
  Eliminates the dual-write: zero lost events, at-least-once publication
  (compensated by pattern:messaging:idempotent-consumer), and no
  distributed transaction (2PC).
costs: >-
  Table + relay + replay management (order, at-least-once); publication is
  not instantaneous (poller latency); the outbox schema must be versioned
  (see pattern:database:versioned-migrations).
related: >-
  Negative counterpart: pattern:antipattern:msg-offset-commit-misorder
  (reliable publication reduces reprocessing).
relationships:
  references:
    - https://microservices.io/patterns/data/transactional-outbox.html
    - https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/transactional-outbox.html
    - pattern:antipattern:msg-offset-commit-misorder
  uses: []
  validated_by: []
