id: pattern:go:constructor-injection
title: Constructor injection — explicit dependencies without a framework
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, dependency-injection, design, testing]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Dependencies (db, logger, config, clients) are read from globals or built
  inside the types: impossible to replace in tests, opaque initialization
  order, shared state (see pattern:antipattern:go-mutable-global-state).
context: >-
  Applies to any type that needs a dependency to work, as soon as it is
  tested or reused.
solution: >-
  Conventional constructor `New(deps…) (*T, error)` that stores dependencies
  in the type's fields; graph composition in `main` or a single
  `wire()`/`newApp()` function. No framework: manual constructor injection
  covers ~95% of cases.
benefits: >-
  Testable (real dependencies or fakes by construction, never global
  mutation), explicit and ordered initialization, construction errors
  returned instead of panicking.
costs: >-
  Manual dependency passing becomes verbose in large graphs (the threshold
  where fx/wire are justified); the constructor must stay side-effect-free
  (see pattern:antipattern:go-init-misuse).
related: >-
  Negative counterparts: pattern:antipattern:go-mutable-global-state,
  pattern:antipattern:go-init-misuse.
relationships:
  references:
    - https://go.dev/wiki/CodeReviewComments
    - https://100go.co/
    - pattern:antipattern:go-mutable-global-state
