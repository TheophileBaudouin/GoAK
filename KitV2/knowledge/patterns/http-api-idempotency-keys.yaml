id: pattern:http:api-idempotency-keys
title: Idempotency keys — safe retries for writes
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [http, api, idempotency, reliability]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  A network or client retry duplicates a business effect (payment, creation,
  sending) — POSTs are not idempotent by nature (see
  pattern:antipattern:api-no-pagination).
context: >-
  Applies to non-idempotent writes (creation, action) where a duplicate is
  expensive.
solution: >-
  The client sends an `Idempotency-Key` header (UUID); the server stores the
  key and the associated response (key → response/state table), and returns
  the same response for a retry with the same key. In Go: middleware or
  service layer that reads/writes the table in the same transaction as the
  effect.
benefits: >-
  Clients can retry safely, network incidents no longer produce duplicates,
  and the contract is simple to document.
costs: >-
  Storage/expiration cost of keys (TTL) and of the check; the key must be
  checked BEFORE the effect (race) — store it atomically with the creation.
related: >-
  Negative counterpart: pattern:antipattern:api-no-pagination.
relationships:
  references:
    - https://datatracker.ietf.org/doc/draft-ietf-httpapi-idempotency-key-header/
    - pattern:antipattern:api-no-pagination
  uses: []
  validated_by: []
