id: pattern:observability:correlation-ids
title: Correlation identifiers — link a request's signals
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [observability, correlation, tracing, logs]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  In a distributed architecture, a user action crosses several services:
  without a common link, the logs of each step are islands and the incident
  is impossible to reconstruct (see
  pattern:antipattern:obs-logging-not-observability).
context: >-
  Applies as soon as more than one service or process participates in a
  request, or a worker consumes events.
solution: >-
  Generate a unique identifier at the entry (middleware), propagate it via
  header (`X-Request-Id`, `traceparent`) and in the context (see
  pattern:go:private-context-keys), and include it in every log, error, and
  metric of the request. In Go: chi middleware + `slog` with the ID in the
  handler, or OpenTelemetry for full traces (kit source).
benefits: >-
  Reconstruct the full path of a request (logs + errors + metrics), answer
  "did this request succeed?" and correlate user complaints with traces.
costs: >-
  Injecting the ID into every log requires discipline (dedicated handler);
  the ID alone does not replace distributed traces (see
  source:go:opentelemetry) when the budget justifies them.
related: >-
  Knowledge: observability/otel-go.yaml (source:go:opentelemetry). Negative
  counterpart: pattern:antipattern:obs-logging-not-observability.
relationships:
  references:
    - https://microservices.io/patterns/observability/distributed-tracing.html
    - https://microsoft.github.io/code-with-engineering-playbook/observability/correlation-id/
    - pattern:antipattern:obs-logging-not-observability
  uses: []
  validated_by: []
