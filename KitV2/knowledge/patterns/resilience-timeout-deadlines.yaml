id: pattern:resilience:timeout-deadlines
title: Strict deadlines — context deadlines at every boundary
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [resilience, timeout, context, latency]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Without a deadline, a blocked call (network, DB, service) freezes a
  worker indefinitely and latency accumulates (see
  pattern:antipattern:http-no-timeouts).
context: >-
  Applies at every I/O boundary: HTTP server, service client, database,
  message queues.
solution: >-
  Enforce one deadline per operation: `context.WithTimeout(parent, d)` (with
  `defer cancel()`) at the entry of a blocking call, `http.Server` timeouts
  (ReadHeader/Read/Write/Idle) for the server, `http.TimeoutHandler` for
  long handlers. Respect inheritance: a child deadline cannot exceed the
  parent deadline (check `ctx.Deadline()` if needed).
benefits: >-
  Every operation has a bounded maximum cost; degradation is predictable
  (deadline exceeded) instead of an infinite wait; deadline propagation
  prevents cascading runaway.
costs: >-
  A deadline that is too short causes premature failures (tune by
  measurement); values depend on the product — the rule is to set them, not
  a universal value.
related: >-
  Recipe: recipe-graceful-shutdown. Negative counterpart:
  pattern:antipattern:http-no-timeouts.
relationships:
  references:
    - https://blog.cloudflare.com/the-complete-guide-to-golang-net-http-timeouts/
    - https://pkg.go.dev/context
    - pattern:antipattern:http-no-timeouts
  uses: []
  validated_by: []
