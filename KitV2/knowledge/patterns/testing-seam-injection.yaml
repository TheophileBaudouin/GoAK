id: pattern:testing:seam-injection
title: Testable seams — separate logic from effects
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, testing, seam, design-for-testability]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Logic mixed with effects (terminal, clock, framework) is impossible to
  test without heavy harnesses, and the tests become fragile (see
  pattern:antipattern:test-sleep-based and
  pattern:antipattern:test-implementation-details).
context: >-
  Applies to any decision logic (state, transformation, choice) backed by
  an external effect: TUI, CLI, handler, job.
solution: >-
  Separate the pure logic (data in → decision out) from the effects:
  `handleKey(string)`, `render()`, `execute(command)` pure, tested
  directly; the effect (tea.Program, os.Args, time.Now) stays a thin
  thread around the seam. Inject the clock and dependencies as parameters
  (see pattern:go:constructor-injection).
benefits: >-
  Deterministic tests without sleep or terminal, internal refactors
  without breaking the tests (the contract is the seam), and simple
  error-path coverage (see recipe-cli-interactive for the canonical
  example).
costs: >-
  Requires designing the seams from the start; an overly thin seam
  (everything pure) moves the complexity into the effect thread — keep the
  thread minimal and untested.
related: >-
  Recipe: recipe-cli-interactive (seam handleKey). Negative counterpart:
  pattern:antipattern:test-sleep-based,
  pattern:antipattern:test-implementation-details.
relationships:
  references:
    - https://martinfowler.com/bliki/UnitTest.html
    - pattern:antipattern:test-sleep-based
  uses: []
  validated_by: []
