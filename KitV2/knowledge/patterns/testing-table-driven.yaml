id: pattern:testing:table-driven
title: Table-driven tests — cases in a table, assertions in a loop
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, testing, table-driven]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  One test per case duplicates the harness (call, assertion, setup); copied
  tests diverge and edge cases are forgotten.
context: >-
  Applies to any function testable by inputs/outputs with several cases
  (nominal, boundaries, errors).
solution: >-
  The idiomatic Go pattern (official wiki): a slice of cases `{name,
  input, want}` + `t.Run(name, func(t *testing.T) { … })` in a loop. Name
  each case, test errors as outputs (wantErr), use subtests for isolation.
benefits: >-
  A single harness, trivial case addition, isolated execution per subtest
  (`-run TestX/cas`), and the full contract readable at a glance.
costs: >-
  Cases with very different setups (heavy dependencies) break the table —
  extract a dedicated harness instead; do not force complex stateful
  scenarios into a flat table.
related: >-
  Kit rules: `rules/registry/testing`. Negative counterpart:
  pattern:antipattern:test-brittle-tests.
relationships:
  references:
    - https://go.dev/wiki/TableDrivenTests
    - pattern:antipattern:test-brittle-tests
  uses: []
  validated_by: []
