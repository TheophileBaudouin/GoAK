id: pattern:messaging:dead-letter-queue
title: Dead-letter queue — isolate unprocessable messages
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [messaging, kafka, dlq, resilience]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  A structurally invalid message loops in retry and blocks the partition
  (see pattern:antipattern:msg-poison-pill-no-dlq): valid messages behind it
  are never processed.
context: >-
  Applies to any queue consumer (Kafka, AMQP) whose messages can be
  corrupted or non-conforming.
solution: >-
  Separate the errors: transient → bounded retry; permanent
  (deserialization, validation) → route to a DLQ with the cause and
  metadata. Consume the DLQ with a dedicated process (repair, replay,
  alert) and measure its volume.
benefits: >-
  The partition always advances, the order of valid messages is preserved,
  and contract problems are visible and actionable — not silent.
costs: >-
  Additional infrastructure (topic + consumer) and retention/replay policies
  to define; an unmonitored DLQ becomes a silent dump — alert on its growth.
related: >-
  Negative counterpart: pattern:antipattern:msg-poison-pill-no-dlq.
relationships:
  references:
    - https://www.confluent.io/blog/spring-kafka-can-your-kafka-consumers-handle-a-poison-pill/
    - https://www.conduktor.io/blog/dead-letter-topics-handling-poison-pills
    - pattern:antipattern:msg-poison-pill-no-dlq
