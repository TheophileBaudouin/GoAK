id: pattern:go:private-context-keys
title: Private and typed context keys
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, context, values, keys, api]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Carry request values (user ID, request ID, tenant) in the context without
  collision or implementation leakage between packages.
context: >-
  Applies when request values cross several layers and must not be function
  parameters (cross-cutting, middleware).
solution: >-
  Key type private to the package that reads the value
  (`type ctxKey string` + unexported private constant), exported access
  functions (`WithUser(ctx, u)`, `UserFrom(ctx)`) that encapsulate the key.
  Keep the number of keys minimal and document each value.
benefits: >-
  Impossible to collide with another package; the public API exposes
  functions, not keys; values are typed on read (no risky cast).
costs: >-
  One indirection (functions); the context stays suited to request values,
  not business parameters — do not hide dependencies in it (see
  pattern:go:constructor-injection).
related: >-
  Negative counterpart: pattern:antipattern:go-context-key-collision.
relationships:
  references:
    - https://go.dev/blog/context
    - https://pkg.go.dev/context
    - pattern:antipattern:go-context-key-collision
