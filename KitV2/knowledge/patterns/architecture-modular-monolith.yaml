id: pattern:architecture:modular-monolith
title: Modular monolith — strong internal boundaries
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [architecture, modular-monolith, internal, boundaries]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Premature microservice decomposition adds latency and operational cost
  without real business boundaries (see
  pattern:antipattern:arch-distributed-monolith); the spaghetti monolith, for
  its part, becomes unmanageable.
context: >-
  Applies as the default choice for small teams and existing monolithic
  systems: a single binary with modular boundaries.
solution: >-
  A single deployable with strong-boundary modules: `internal/<module>`
  packages (the compiler blocks external imports), access between modules only
  through the module's public API (exported functions and types), data owned
  by one module. DDD bounded contexts materialize as packages.
benefits: >-
  The coupling benefits of a monolith (simple deployment, local transactions,
  zero network latency) with compiler-verified boundaries that allow future
  extraction into services if needed.
costs: >-
  The boundaries are logical: they require discipline and linting (no bypass
  through shared packages); extracting a module into a service remains a
  project (see pattern:architecture:ports-adapters to ease that evolution).
related: >-
  Negative counterpart: pattern:antipattern:arch-distributed-monolith,
  pattern:antipattern:arch-big-ball-of-mud.
relationships:
  references:
    - https://go.dev/doc/modules/layout
    - https://microservices.io/patterns/monolithic.html
    - pattern:antipattern:arch-distributed-monolith
  uses: []
  validated_by: []
