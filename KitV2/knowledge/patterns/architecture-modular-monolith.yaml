id: pattern:architecture:modular-monolith
title: Monolithe modulaire — frontières internes fortes
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [architecture, modular-monolith, internal, boundaries]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  La décomposition en microservices prématurée ajoute de la latence et de
  l'opération sans frontières métier réelles (voir
  pattern:antipattern:arch-distributed-monolith) ; le monolithe spaghetti,
  lui, devient ingérable.
context: >-
  S'applique comme choix par défaut pour les équipes de petite taille et les
  systèmes monolithiques existants : un seul binaire, des frontières
  modulaires.
solution: >-
  Un déployable unique avec des modules à frontières fortes : packages
  `internal/<module>` (le compilateur bloque les imports externes), accès
  entre modules uniquement par API publique du module (fonctions et types
  exportés), données possédées par un module. Les bounded contexts (DDD) se
  matérialisent en packages.
benefits: >-
  Les bénéfices de couplage d'un monolithe (déploiement simple, transactions
  locales, zéro latence réseau) avec des frontières compilateur-vérifiées qui
  permettent une extraction future vers des services si besoin.
costs: >-
  Les frontières sont logiques : elles exigent discipline et lint (pas de
  bypass via des packages partagés) ; l'extraction d'un module en service
  reste un chantier (voir pattern:architecture:ports-adapters pour faciliter
  cette évolution).
related: >-
  Homologue négatif : pattern:antipattern:arch-distributed-monolith,
  pattern:antipattern:arch-big-ball-of-mud.
relationships:
  references:
    - https://go.dev/doc/modules/layout
    - https://microservices.io/patterns/monolithic.html
    - pattern:antipattern:arch-distributed-monolith
  uses: []
  validated_by: []
