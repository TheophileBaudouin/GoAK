id: pattern:database:versioned-migrations
title: Versioned migrations — the schema is code
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [database, migrations, schema, versioning]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Modifying the schema in production with ad hoc SQL or a hand-run "ALTER"
  makes the database state unknown and environments diverge.
context: >-
  Applies as soon as a shared database exists, in particular as soon as two
  environments (dev, prod) must stay synchronized.
solution: >-
  Versioned migrations (numbered files, applied once, tracked in VCS) via the
  admitted golang-migrate CLI: explicit up/down, ordered application, state
  traced in a version table. Migrations are part of the deployment and are
  not run at each replica's startup.
benefits: >-
  Reproducible and auditable database state, possible rollback, schema
  changes reviewed like code, CI applying migrations before tests.
costs: >-
  Destructive migrations (drop, rename) require deployment plans
  (backward-compatible first); ordering and branch conflicts are handled
  like code.
related: >-
  Catalog: golang-migrate
  (knowledge/catalogs/libraries/golang-migrate/SKILL.md).
relationships:
  references:
    - https://github.com/golang-migrate/migrate
  uses: []
  validated_by: []
