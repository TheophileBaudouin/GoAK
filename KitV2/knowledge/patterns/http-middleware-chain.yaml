id: pattern:http:middleware-chain
title: Chaîne de middleware — composition transverse propre
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [http, middleware, chi, logging, auth]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  La gestion transverse (logging, auth, recovery, CORS, rate limit) dupliquée
  dans chaque handler devient incohérente et inoubliable (voir
  pattern:antipattern:rest-ignoring-http-semantics).
context: >-
  S'applique à tout serveur HTTP avec des préoccupations transverses partagées
  par plusieurs routes.
solution: >-
  Middleware = `func(http.Handler) http.Handler` composé avant les routes :
  avec chi, `r.Use(requestID, logger, recoverer, auth)` pour le global et
  `r.Group`/`r.With` pour le périmètre. Chaque middleware enveloppe, appelle
  le suivant, et peut court-circuiter (auth → 401) sans toucher les handlers.
benefits: >-
  Une préoccupation = un composant testable isolément (httptest, voir
  pattern:testing:httptest) ; ordre explicite (request ID avant logger) ;
  zéro duplication dans les handlers.
costs: >-
  L'ordre des middlewares est un contrat implicite (documenter) ; un
  middleware trop épais (toute la logique dedans) redevient du code spaghetti
  — garder chaque middleware monofonction.
related: >-
  Catalog : chi (knowledge/catalogs/libraries/chi). Recette :
  recipe-rest-chi. Homologue négatif :
  pattern:antipattern:rest-ignoring-http-semantics.
relationships:
  references:
    - https://github.com/go-chi/chi
    - pattern:antipattern:rest-ignoring-http-semantics
  uses: []
  validated_by: []
