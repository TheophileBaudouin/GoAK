id: pattern:http:middleware-chain
title: Middleware chain — clean cross-cutting composition
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [http, middleware, chi, logging, auth]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Cross-cutting concerns (logging, auth, recovery, CORS, rate limiting)
  duplicated in every handler become inconsistent and easy to forget (see
  pattern:antipattern:rest-ignoring-http-semantics).
context: >-
  Applies to any HTTP server with cross-cutting concerns shared by several
  routes.
solution: >-
  Middleware = `func(http.Handler) http.Handler` composed before the routes:
  with chi, `r.Use(requestID, logger, recoverer, auth)` for global concerns
  and `r.Group`/`r.With` for a scope. Each middleware wraps, calls the next,
  and can short-circuit (auth → 401) without touching the handlers.
benefits: >-
  One concern = one component testable in isolation (httptest, see
  pattern:testing:httptest); explicit order (request ID before logger); zero
  duplication in handlers.
costs: >-
  Middleware order is an implicit contract (document it); an over-thick
  middleware (all the logic inside) becomes spaghetti code again — keep each
  middleware single-function.
related: >-
  Catalog: chi (knowledge/catalogs/libraries/chi). Recipe:
  recipe-rest-chi. Negative counterpart:
  pattern:antipattern:rest-ignoring-http-semantics.
relationships:
  references:
    - https://github.com/go-chi/chi
    - pattern:antipattern:rest-ignoring-http-semantics
  uses: []
  validated_by: []
