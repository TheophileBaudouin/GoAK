id: pattern:testing:httptest
title: httptest — test HTTP handlers and clients without a port
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, testing, httptest, http]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Testing HTTP code by opening a real port is slow, fragile in CI, and does
  not test the handler as a real client would.
context: >-
  Applies to the handlers (responses/statuses) and HTTP clients (emitted
  requests, interpreted responses) of any application.
solution: >-
  Two stdlib tools: `httptest.NewRequest` + `httptest.ResponseRecorder`
  to run a handler without network; `httptest.NewServer(handler)` to
  provide a real URL to a client — it implements the real
  request/response cycle, including transport errors. Test statuses,
  bodies, headers and, client-side, the error cases (500, timeout).
benefits: >-
  Deterministic tests without a port or conflicts, handlers and clients
  tested against their real contract, and the basis for HTTP fakes (see
  pattern:testing:fakes-over-mocks).
costs: >-
  A handler tested in isolation does not cover full routing — combine with
  a route test (chi via httptest); `NewServer` starts a real server (light
  cost, close with `defer srv.Close()`).
related: >-
  Recipe: recipe-rest-chi. Negative counterpart:
  pattern:antipattern:test-over-mocking.
relationships:
  references:
    - https://pkg.go.dev/net/http/httptest
    - pattern:antipattern:test-over-mocking
  uses: []
  validated_by: []
