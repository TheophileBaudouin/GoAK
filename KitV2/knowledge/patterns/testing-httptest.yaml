id: pattern:testing:httptest
title: httptest — tester handlers et clients HTTP sans port
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, testing, httptest, http]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Tester du code HTTP en ouvrant un vrai port est lent, fragile en CI et ne
  teste pas le handler comme le ferait un client réel.
context: >-
  S'applique aux handlers (réponses/statuts) et aux clients HTTP (requêtes
  émises, réponses interprétées) de toute application.
solution: >-
  Deux outils de la stdlib : `httptest.NewRequest` + `httptest.ResponseRecorder`
  pour exécuter un handler sans réseau ; `httptest.NewServer(handler)` pour
  fournir une URL réelle à un client — il implémente le vrai cycle
  requête/réponse, y compris les erreurs de transport. Tester statuts, corps,
  en-têtes et, côté client, les cas d'erreur (500, timeout).
benefits: >-
  Tests déterministes sans port ni conflit, handlers et clients testés dans
  leur vrai contrat, et base des fakes HTTP (voir
  pattern:testing:fakes-over-mocks).
costs: >-
  Un handler testé isolément ne couvre pas le routage complet — combiner avec
  un test de route (chi via httptest) ; `NewServer` démarre un vrai serveur
  (coût léger, fermer avec `defer srv.Close()`).
related: >-
  Recette : recipe-rest-chi. Homologue négatif :
  pattern:antipattern:test-over-mocking.
relationships:
  references:
    - https://pkg.go.dev/net/http/httptest
    - pattern:antipattern:test-over-mocking
  uses: []
  validated_by: []
