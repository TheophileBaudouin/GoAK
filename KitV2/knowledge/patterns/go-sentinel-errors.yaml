id: pattern:go:sentinel-errors
title: Sentinel, typed, and opaque errors
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, errors, sentinel, typed, opaque]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Every caller must decide what to do based on an error's cause, but without
  a common strategy comparisons are fragile (strings) or couple the caller
  to the implementation.
context: >-
  Applies at a package's public boundary that exposes expected failures:
  validation, not found, conflict, unavailable.
solution: >-
  Choose one of Dave Cheney's three strategies based on need: sentinel
  (`var ErrNotFound = errors.New(...)`) for simple, stable cases; error type
  (`type ValidationError struct{ Field string }`) when the caller needs
  structured details; opaque (`return errors.New("…")`) when the caller only
  decides success/failure. Inspect via `errors.Is`/`As`.
benefits: >-
  Stable, testable error contract, caller/implementation decoupling
  (opaque), and deterministic mapping to HTTP statuses or retries.
costs: >-
  Sentinels create package coupling (the caller imports the sentinel); types
  require clear docs. Mixing the three in one package blurs the contract —
  choose per boundary.
related: >-
  Kit rules: `rules/core/errors` (sentinel/typed/opaque, handle-once).
  Negative counterpart: pattern:antipattern:go-error-string-matching.
relationships:
  references:
    - https://dave.cheney.net/2016/04/27/dont-just-check-errors-handle-them-gracefully
    - https://go.dev/wiki/ErrorValueFAQ
    - pattern:antipattern:go-error-string-matching
  uses: []
  validated_by: []
