id: pattern:go:sentinel-errors
title: Erreurs sentinelles, typées et opaques
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, errors, sentinel, typed, opaque]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Chaque appelant doit décider quoi faire selon la cause d'une erreur, mais
  sans stratégie commune les comparaisons sont fragiles (chaînes) ou couplent
  l'appelant à l'implémentation.
context: >-
  S'applique à la frontière publique d'un package qui expose des échecs
  attendus : validation, introuvable, conflit, indisponible.
solution: >-
  Choisir une des trois stratégies de Dave Cheney selon le besoin : sentinelle
  (`var ErrNotFound = errors.New(...)`) pour les cas simples et stables ;
  type d'erreur (`type ValidationError struct{ Field string }`) quand l'appelant
  a besoin de détails structurés ; opaque (`return errors.New("…")`) quand
  l'appelant ne doit décider que succès/échec. Inspecter via `errors.Is`/`As`.
benefits: >-
  Contrat d'erreur stable et testable, découplage appelant/implémentation
  (opaque), et mapping déterministe vers les statuts HTTP ou les retries.
costs: >-
  Les sentinelles créent un couplage de package (l'appelant importe la
  sentinelle) ; les types exigent une doc claire. Mélanger les trois dans un
  même package brouille le contrat — choisir par frontière.
related: >-
  Règles du kit : `rules/core/errors` (sentinel/typed/opaque, handle-once).
  Homologue négatif : pattern:antipattern:go-error-string-matching.
relationships:
  references:
    - https://dave.cheney.net/2016/04/27/dont-just-check-errors-handle-them-gracefully
    - https://go.dev/wiki/ErrorValueFAQ
    - pattern:antipattern:go-error-string-matching
  uses: []
  validated_by: []
