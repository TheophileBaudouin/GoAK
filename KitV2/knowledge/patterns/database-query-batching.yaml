id: pattern:database:query-batching
title: Batch queries — eliminate the N+1 with JOIN/IN
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [database, sql, performance, batching]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  One query per item (N+1) costs one round-trip per row and makes latency
  and load explode (see pattern:antipattern:db-n-plus-one).
context: >-
  Applies as soon as a list of parents needs their children or references:
  linked tables, counts, statuses.
solution: >-
  One global query: `JOIN` for close relations, or batch loading
  `WHERE parent_id IN (…)` (in bounded batches, e.g. 500 ids), then in-memory
  assembly in a map `parentID → []child`. In Go, build the placeholders in
  batches and sort the results after the join.
benefits: >-
  Constant number of queries (1-2) whatever the volume, amortized-linear
  latency, minimal DB load.
costs: >-
  In-memory assembly requires grouping code; giant IN lists break execution
  plans (bound the batches); deeply nested data may justify two queries
  rather than a monstrous JOIN.
related: >-
  Recipe: recipe-sqlite-sqlc (sqlc generates the static queries). Negative
  counterpart: pattern:antipattern:db-n-plus-one.
relationships:
  references:
    - https://sonra.io/mastering-sql-how-to-detect-and-avoid-34-common-sql-antipatterns/
    - pattern:antipattern:db-n-plus-one
