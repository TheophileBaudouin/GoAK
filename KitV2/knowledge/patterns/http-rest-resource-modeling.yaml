id: pattern:http:rest-resource-modeling
title: REST modeling — resources, verbs, and statuses
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [http, rest, api, resources, status-codes]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  An API that tunnels everything through generic POST/GET is opaque: no
  caching, no idempotency, unusable statuses (see
  pattern:antipattern:rest-tunneling).
context: >-
  Applies to any HTTP API exposing entities and their lifecycles to clients
  (internal or external).
solution: >-
  Model resources (names, hierarchies) and use verbs according to their
  semantics: GET (read, idempotent), POST (creation/action), PUT
  (replacement), PATCH (partial update), DELETE; standard statuses
  (400/401/403/404/409/429/5xx); structured errors (RFC 9457 Problem
  Details); cache headers when the resource allows it.
benefits: >-
  Standard clients (caches, proxies, libraries) work without adaptation; the
  contract is readable; verb idempotency protects retries.
costs: >-
  The non-CRUD action (cancel an order) requires an action POST
  (`/orders/{id}/cancel`) — legitimate; forcing every operation into a
  "clean" resource frame produces artificial models.
related: >-
  Catalog: chi. Recipe: recipe-rest-chi. Negative counterpart:
  pattern:antipattern:rest-tunneling,
  pattern:antipattern:rest-ignoring-http-semantics.
relationships:
  references:
    - https://www.infoq.com/articles/rest-anti-patterns
    - https://www.rfc-editor.org/rfc/rfc9457
    - pattern:antipattern:rest-tunneling
  uses: []
  validated_by: []
