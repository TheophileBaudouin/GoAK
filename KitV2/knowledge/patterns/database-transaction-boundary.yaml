id: pattern:database:transaction-boundary
title: Transaction boundary — BeginTx + deferred Rollback
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [database, sql, transactions, atomicity]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Several writes must be atomic; a manual BEGIN/COMMIT or a commit without
  rollback leaves the database in an unpredictable state on error (see
  pattern:antipattern:db-raw-transactions).
context: >-
  Applies to any multi-write operation (create + references, validate +
  statuses, outbox) that must succeed or fail together.
solution: >-
  `tx, err := db.BeginTx(ctx, nil)`; all operations on `tx`;
  `defer tx.Rollback()` (no effect after commit); `tx.Commit()` at the end
  with its error checked. Keep the transaction short (no external I/O inside
  it) and its boundary within a single function.
benefits: >-
  Atomicity guaranteed by the API (never an orphaned state), automatic
  rollback on every error path, and one transaction = one testable function.
costs: >-
  The transaction locks rows and holds a pool connection (see
  pattern:database:pool-config) — short duration is the trade-off; no
  savepoint API in database/sql (raw driver-dependent SQL if needed).
related: >-
  Negative counterpart: pattern:antipattern:db-raw-transactions.
relationships:
  references:
    - https://go.dev/doc/database/execute-transactions
    - https://pkg.go.dev/database/sql
    - pattern:antipattern:db-raw-transactions
  uses: []
  validated_by: []
