id: pattern:architecture:ports-adapters
title: Ports & adapters — domain decoupled from infrastructure
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [architecture, hexagonal, ports, adapters, domain]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Business logic mixed with infrastructure (HTTP, SQL, files) makes the domain
  impossible to test in isolation and coupled to every technology (see
  pattern:antipattern:arch-big-ball-of-mud).
context: >-
  Applies to services that interact with several external systems or expose
  several entry points (HTTP, gRPC, CLI, worker); overkill for simple CRUD.
solution: >-
  The domain depends only on **ports** (consumer interfaces); the **adapters**
  (HTTP handlers, SQL repository, Kafka producer) implement those interfaces.
  In Go: small interfaces defined on the consumer side (see
  pattern:go:concrete-returns), explicit wiring in the constructor
  (pattern:go:constructor-injection), `context.Context` at I/O boundaries.
benefits: >-
  Domain testable without infrastructure (fakes on the ports, see
  pattern:testing:fakes-over-mocks), localized technology replacement, and
  extraction into a service (see pattern:architecture:modular-monolith).
costs: >-
  Indirection and file count; each port must reflect a real domain need —
  ports modeled on the libraries reintroduce coupling (see
  pattern:antipattern:go-interface-everywhere).
related: >-
  Negative counterpart: pattern:antipattern:arch-big-ball-of-mud.
relationships:
  references:
    - https://softwarepatternslexicon.com/go/architectural-patterns-in-go/hexagonal-architecture-ports-and-adapters/
    - pattern:antipattern:arch-big-ball-of-mud
