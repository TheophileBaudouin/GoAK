id: pattern:cli:subcommands-conventions
title: Structured CLI — subcommands and conventions
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [cli, cobra, subcommands, conventions]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  A CLI without structure (global flags, ad hoc actions, inconsistent output)
  is unpredictable and not scriptable (see
  pattern:antipattern:cli-flag-and-convention-abuse).
context: >-
  Applies to any command-line tool with more than a few operations or meant
  for other users/CI.
solution: >-
  Subcommand tree (git/gcloud/docker): `tool group action [flags]`; full
  help and `--version`; meaningful exit codes (0 success, 2 usage, ≠0
  error); optional flags with safe defaults and consistent aliases; stable
  output for scripts (JSON/--quiet when needed). In Go: stdlib flag for the
  minimal case (recipe-cli-minimal), cobra for the tree (recipe-cli-cobra,
  cobra catalog).
benefits: >-
  Discovery via `help`, predictable scriptability, familiar conventions
  (usable by humans AND LLMs), and tests of help/exit codes.
costs: >-
  A single-action tool does not need subcommands (the minimal suffices); the
  tree adds documentation surface to maintain.
related: >-
  Recipes: recipe-cli-minimal, recipe-cli-cobra, recipe-cli-interactive.
  Catalog: cobra. Negative counterpart:
  pattern:antipattern:cli-flag-and-convention-abuse.
relationships:
  references:
    - https://clig.dev/
    - pattern:antipattern:cli-flag-and-convention-abuse
  uses: []
  validated_by: []
