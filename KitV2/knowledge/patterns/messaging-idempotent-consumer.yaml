id: pattern:messaging:idempotent-consumer
title: Idempotent consumer — absorb duplicates
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [messaging, kafka, idempotency, consumer]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Queues guarantee at-least-once delivery: a message can be received several
  times (rebalance, retry, redelivery). Processing a non-idempotent effect
  twice produces duplicates (see
  pattern:antipattern:msg-offset-commit-misorder).
context: >-
  Applies to any consumer whose processing has an external effect (DB write,
  API call, sending).
solution: >-
  Make processing idempotent by business key: deduplicate by `event_id`
  (table of processed events checked atomically with the effect, or a unique
  constraint on the key), or design the effect to be replayable (upsert,
  PUT). Commit the offset after successful processing
  (see pattern:messaging:transactional-outbox for reliability).
benefits: >-
  Duplicates absorbed at no cost, retries and rebalances without
  consequence, and at-least-once semantics assumed cleanly.
costs: >-
  Deduplication storage (TTL) or constraints to design; key-based
  idempotency requires a stable key on the producer side — document the
  event contract.
related: >-
  Negative counterpart: pattern:antipattern:msg-offset-commit-misorder.
relationships:
  references:
    - https://kafka.apache.org/documentation/#semantics
    - pattern:antipattern:msg-offset-commit-misorder
  uses: []
  validated_by: []
