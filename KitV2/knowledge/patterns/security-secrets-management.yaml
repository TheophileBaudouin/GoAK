id: pattern:security:secrets-management
title: Secrets management — out of code, rotatable
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [security, secrets, credentials, vault]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Secrets in code or artifacts are exposed to anyone who reads the
  repository, and rotating them becomes impossible without redeployment
  (see pattern:antipattern:sec-hardcoded-credentials).
context: >-
  Applies to any program that handles credentials: databases, APIs,
  providers, signatures.
solution: >-
  Read secrets from the environment or a dedicated manager (Vault, cloud
  secret manager, KMS) at startup — never from code or logs. Secret
  scanning in CI (gitleaks), scheduled rotation, and minimal per-service
  access (least privilege).
benefits: >-
  A compromised secret is limited in time (rotation), no secrets in the VCS
  or artifacts, and revocation without redeployment.
costs: >-
  Dependency on a manager (operational cost); local development secrets
  need a simple path (gitignored file, docker secrets) distinct from
  production.
related: >-
  Negative counterpart: pattern:antipattern:sec-hardcoded-credentials.
relationships:
  references:
    - https://owasp.org/www-community/vulnerabilities/Use_of_hard-coded_password
    - https://cwe.mitre.org/data/definitions/798.html
    - pattern:antipattern:sec-hardcoded-credentials
  uses: []
  validated_by: []
