id: pattern:security:secrets-management
title: Gestion des secrets — hors du code, rotation possible
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [security, secrets, credentials, vault]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Les secrets dans le code ou les artefacts sont exposés à quiconque lit le
  dépôt, et leur rotation devient impossible sans redéploiement (voir
  pattern:antipattern:sec-hardcoded-credentials).
context: >-
  S'applique à tout programme qui manipule des credentials : bases, APIs,
  fournisseurs, signatures.
solution: >-
  Lire les secrets depuis l'environnement ou un gestionnaire dédié (Vault,
  secret manager cloud, KMS) au démarrage — jamais depuis le code ni les
  logs. Scan de secrets en CI (gitleaks), rotation cadencée,
  et accès minimaux par service (least privilege).
benefits: >-
  Compromission d'un secret limitée dans le temps (rotation), aucun secret
  dans le VCS ni les artefacts, et révocation sans redéploiement.
costs: >-
  Dépendance à un gestionnaire (coût opérationnel) ; les secrets de
  développement local exigent un chemin simple (fichier gitignoré, docker
  secrets) distinct de la production.
related: >-
  Homologue négatif : pattern:antipattern:sec-hardcoded-credentials.
relationships:
  references:
    - https://owasp.org/www-community/vulnerabilities/Use_of_hard-coded_password
    - https://cwe.mitre.org/data/definitions/798.html
    - pattern:antipattern:sec-hardcoded-credentials
  uses: []
  validated_by: []
