id: pattern:concurrency:pipeline
title: Pipeline — étages de goroutines reliés par canaux
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, concurrency, pipeline, channels, context]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Traiter un flux de données par étapes séquentielles (lecture → transform →
  écriture) en parallélisant chaque étape sans fuite de goroutines.
context: >-
  S'applique aux traitements de flux où chaque étage est indépendant et peut
  tourner en concurrence (ETL, logs, transformations de lots).
solution: >-
  Le pattern officiel du Go blog : un étage = une goroutine qui lit un canal
  d'entrée et écrit sur un canal de sortie ; chaque étage **ferme son canal de
  sortie** ; l'annulation se propage par `ctx.Done()` sélectionné dans chaque
  étage ; le consommateur final draine.
benefits: >-
  Parallélisme par étage sans verrou (les canaux coordonnent), bornes
  naturelles de backpressure, et la fermeture + annulation garantissent
  l'absence de fuites (voir pattern:go:contextual-worker).
costs: >-
  Latence inter-étages et complexité de raisonnement ; pour un simple map sur
  liste, un worker pool suffit — le pipeline se justifie quand chaque étage
  coûte cher ou bloque (I/O).
related: >-
  Règles du kit : `rules/core/concurrency`. Homologue négatif :
  pattern:antipattern:go-goroutine-leak.
relationships:
  references:
    - https://go.dev/blog/pipelines
    - pattern:antipattern:go-goroutine-leak
  uses: []
  validated_by: []
