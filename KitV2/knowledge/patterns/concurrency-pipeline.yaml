id: pattern:concurrency:pipeline
title: Pipeline — goroutine stages connected by channels
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, concurrency, pipeline, channels, context]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Process a data stream in sequential stages (read → transform → write)
  while parallelizing each stage without goroutine leaks.
context: >-
  Applies to stream processing where each stage is independent and can run
  concurrently (ETL, logs, batch transformations).
solution: >-
  The official Go blog pattern: a stage = one goroutine that reads an input
  channel and writes to an output channel; each stage **closes its output
  channel**; cancellation propagates via `ctx.Done()` selected in each
  stage; the final consumer drains.
benefits: >-
  Per-stage parallelism without locks (channels coordinate), natural
  backpressure bounds, and closure + cancellation guarantee the absence of
  leaks (see pattern:go:contextual-worker).
costs: >-
  Inter-stage latency and reasoning complexity; for a simple map over a
  list, a worker pool suffices — the pipeline is justified when each stage
  is expensive or blocks (I/O).
related: >-
  Kit rules: `rules/core/concurrency`. Negative counterpart:
  pattern:antipattern:go-goroutine-leak.
relationships:
  references:
    - https://go.dev/blog/pipelines
    - pattern:antipattern:go-goroutine-leak
  uses: []
