id: pattern:config:twelve-factor-config
title: Configuration externalisée — valeurs par environnement
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [config, environment, twelve-factor]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Les valeurs par environnement (URLs, ports, credentials) codées en dur
  imposent un rebuild par environnement et risquent la fuite (voir
  pattern:antipattern:cfg-hardcoded-values).
context: >-
  S'applique à tout programme déployé dans plus d'un environnement ou
  consommé par d'autres équipes.
solution: >-
  Principe Twelve-Factor : la config vit dans l'environnement (variables ou
  fichier injecté), jamais dans le code. En Go : struct `Config` typée,
  chargée depuis env/flags/fichier (voir recipe-config-viper et
  recipe-config-koanf), validée au démarrage avec échec rapide — le même
  artefact déployé partout, valeurs au runtime.
benefits: >-
  Même binaire en dev/staging/prod, rotation des credentials sans rebuild,
  démarrage qui échoue vite si la config est invalide (pas de surprise à la
  première requête).
costs: >-
  La prolifération de variables non documentées devient illisible — regrouper
  et valider ; les secrets ne doivent pas passer par les flags de processus
  (historique dans ps), préférer env/secret manager.
related: >-
  Recettes : recipe-config-viper, recipe-config-koanf. Homologue négatif :
  pattern:antipattern:cfg-hardcoded-values,
  pattern:antipattern:sec-hardcoded-credentials.
relationships:
  references:
    - https://12factor.net/config
    - pattern:antipattern:cfg-hardcoded-values
  uses: []
  validated_by: []
