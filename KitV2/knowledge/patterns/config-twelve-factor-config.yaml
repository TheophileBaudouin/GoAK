id: pattern:config:twelve-factor-config
title: Externalized configuration — per-environment values
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [config, environment, twelve-factor]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Per-environment values (URLs, ports, credentials) hardcoded in the source
  force a rebuild per environment and risk leakage (see
  pattern:antipattern:cfg-hardcoded-values).
context: >-
  Applies to any program deployed in more than one environment or consumed
  by other teams.
solution: >-
  Twelve-Factor principle: configuration lives in the environment (variables
  or an injected file), never in the code. In Go: a typed `Config` struct,
  loaded from env/flags/file (see recipe-config-viper and
  recipe-config-koanf), validated at startup with fast failure — the same
  artifact deployed everywhere, values at runtime.
benefits: >-
  Same binary in dev/staging/prod, credential rotation without rebuild,
  startup that fails fast when the config is invalid (no surprise at the
  first request).
costs: >-
  The proliferation of undocumented variables becomes unreadable — group and
  validate; secrets must not go through process flags (history visible in
  ps), prefer env/secret manager.
related: >-
  Recipes: recipe-config-viper, recipe-config-koanf. Negative counterpart:
  pattern:antipattern:cfg-hardcoded-values,
  pattern:antipattern:sec-hardcoded-credentials.
relationships:
  references:
    - https://12factor.net/config
    - pattern:antipattern:cfg-hardcoded-values
  uses: []
  validated_by: []
