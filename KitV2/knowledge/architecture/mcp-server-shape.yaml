id: pattern:architecture:mcp-server-shape
title: MCP server shape — primitives, transport, and trust boundary
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [mcp, architecture, agent, tools, resources, prompts, json-rpc]
go_version: "1.25+"
dependencies: []
last_verified: 2026-08-04
problem: >-
  Exposing capabilities to an LLM agent without a framework produces ad-hoc
  servers, blurry security boundaries, and protocols that are incompatible
  across clients (IDEs, agents, applications). How do you structure an MCP
  server coherently with the spec?
context: >-
  Applies when building an MCP server (official SDK
  github.com/modelcontextprotocol/go-sdk) or deciding how to split host,
  client, and server in an agentic application.
solution: >-
  Follow the spec's client-host-server architecture: the host orchestrates,
  each client manages one session with a server. A server exposes exactly
  three distinct primitives — tools (executable functions the model can
  call), resources (readable data/contexts), prompts (task templates that
  guide the interaction) — and declares them through explicit schemas. Pick
  a suitable transport (stdio for local processes, streamable HTTP/WebSocket
  for remote servers), negotiate the protocol version, and treat each
  primitive as a trust boundary (model input is untrusted, see
  source:mcp:tool-security).
benefits: >-
  Interoperability with every MCP client, a clear separation between read
  (resources) / act (tools) / guide (prompts), standardized sessions, and an
  identifiable security boundary for model inputs.
costs: >-
  The protocol and its version evolution add complexity compared with a plain
  HTTP API; primitive schemas must be kept in sync with the implementation;
  the tooling is pre-1.0-era (pin versions, see the mcp-go-sdk catalog
  entry).
related: >-
  Security counterpart: source:mcp:tool-security. Selection catalog:
  `knowledge/catalogs/libraries/mcp-go-sdk`.
