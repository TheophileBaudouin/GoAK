id: pattern:distribution:bootstrap-cli-runtime
title: Bootstrap CLI and canonical agent runtime
kind: Pattern
version: 1
status: proposed
owner: go-agent-kit
tags:
  - distribution
  - cli
  - runtime
  - adapters
  - modules
  - deterministic-installation
go_version: "1.25+"
dependencies: []
last_verified: 2026-08-03
scope: future-deployment
canonical_runtime: .pi/
official_entrypoint: gak
commands: [init, update, doctor, validate, remove, info]
adapters: [pi, claude-code, codex, cursor, gemini-cli]
module_artifacts: [Rule, Recipe, Pattern, Snippet, Template, Evaluation]
module_examples: [postgres, grpc, auth, kafka, docker, kubernetes, otel]
bootstrap_targets:
  - "go install <future-published-module>/cmd/gak@latest"
  - "go run <future-published-module>/cmd/gak@latest init"
constraints:
  - >-
    A public repository exists (TheophileBaudouin/GoAK, v2.1.0) and a tree-based
    bootstrap installer (install.sh) ships as the interim distribution path; no
    published Go module, gak CLI, or formal release pipeline exists yet.
  - "Deployment is not manual file copying."
  - >-
    @latest is a convenience selector; reproducibility requires resolved
    versions and checksums in a project manifest.
  - >-
    Kit governance tooling remains outside the consumer
    runtime and is never installed as a competing runtime.
  - "Only the selected agent adapter is installed."
  - >-
    Canonical artifact bodies are composed through graph relationships, not
    duplicated by adapters or modules.
relationships:
  references:
    - https://go.dev/ref/mod
    - https://agentskills.io/specification
  uses: []
  validated_by: []
notes: >-
  This is an architecture definition only. The future CLI must resolve a
  versioned release, select modules and one adapter, materialize a staged
  runtime, validate it, and commit atomically with ownership metadata. Until
  then, the root install.sh bootstrap installer materializes the standalone
  product into a consumer directory and verifies it; it is the interim
  path for the first benchmarkable version and never installs governance
  material (contracts, memory, decisions, evaluations).
