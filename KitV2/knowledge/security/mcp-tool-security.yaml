selection: >-
  Load when exposing tools, resources or prompts via MCP (or any agent tool
  boundary): treat every model-generated input as untrusted, validate and
  authorize per invocation, scope privileges to the minimum, and require
  human confirmation for destructive or irreversible actions.
limits: >-
  OWASP LLM Top 10 describes vulnerability classes and mitigations, not a
  formal guarantee: residual risk depends on the concrete tool surface,
  the model in use and the deployment topology — validate with a threat
  model of your own tools.
