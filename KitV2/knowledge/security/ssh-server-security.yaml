source: https://pkg.go.dev/golang.org/x/crypto/ssh
selection: >-
  Load when building an SSH server in Go (charm.land/ssh, wish, or raw
  x/crypto/ssh): generate and persist a per-host key, restrict auth to
  public-key (or password with constant-time compare), pin allowed
  algorithms, and bound session lifetime. Complements the host-key reuse
  failure pattern.
limits: >-
  Library guidance covers the SSH layer, not network-level controls:
  rate limiting, connection quotas and firewall policy remain separate
  (wish provides middlewares for several of them).
