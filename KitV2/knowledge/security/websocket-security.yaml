last_verified: 2026-08-04
source: "https://cheatsheetseries.owasp.org/cheatsheets/\
  WebSocket_Security_Cheat_Sheet.html"
selection: >-
  Load when exposing a WebSocket endpoint (coder/websocket or a stdlib
  upgrade): validate Origin, authenticate the upgrade (not only the initial
  HTTP request), treat every message as untrusted input, use wss/TLS, and plan
  monitoring of an always-on channel. Complements the CSWSH failure pattern.
limits: >-
  The cheatsheet is generic guidance; it does not prove a concrete topology
  (proxy termination, load-balanced upgrades, subprotocol negotiation) —
  verify against RFC 6455 and the transport library in use.
