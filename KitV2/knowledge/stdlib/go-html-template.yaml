selection: >-
  Load when rendering HTML server-side with the stdlib, or when comparing
  html/template to a compiled alternative (templ, see catalog): html/template
  auto-escapes output in the detected HTML/JS/CSS context and should be used
  instead of text/template whenever the output is HTML.
limits: >-
  Auto-escaping covers the contexts the template engine can detect; it is not
  a substitute for input validation at trust boundaries. html/template parses
  templates at runtime (interpreted) — compiled alternatives trade a build
  step for faster rendering (see source:template:compiled-rendering).
