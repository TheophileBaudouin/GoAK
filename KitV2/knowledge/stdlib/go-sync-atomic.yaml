selection: >-
  Load when sharing a single word-sized value between goroutines — counters,
  flags, sequence numbers — where a mutex would be heavier, or when
  publishing an immutable snapshot with atomic.Pointer.
limits: >-
  atomic only covers single-word operations and the Go memory model rules;
  multi-field invariants still need a mutex (see source:go:sync). Do not
  use atomic to "avoid locks" on complex state. Pointer-only routing.
