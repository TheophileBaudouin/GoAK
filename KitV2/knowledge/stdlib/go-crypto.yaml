selection: >-
  Load when choosing a cryptographic primitive: hashes, HMAC, AEAD ciphers,
  TLS, or random values — prefer vetted stdlib implementations and never
  roll your own. Constant-time comparisons route to crypto/subtle.
limits: >-
  A primitive being in the standard library does not make a protocol secure;
  misuse (wrong mode, weak parameters, missing authentication) still breaks
  it. Compare secrets with crypto/subtle —
  pattern:antipattern:sec-timing-unsafe-comparison.
