selection: >-
  Load when the standard library alone does not cover a synchronization
  concern and an x/sync primitive applies: errgroup for bounded concurrent
  fan-out with cancellation, singleflight for request deduplication. Used by
  recipe-worker-pool and the bounded-worker snippet.
limits: >-
  Pointer only — not a copy of the documentation. errgroup.WithContext is a
  bounded fan-out helper, not a general worker pool: memory is bounded only by
  SetLimit, and it does not replace explicit goroutine-lifetime reasoning
  (see rules/core/concurrency).
