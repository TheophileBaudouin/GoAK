---
id: pattern:antipattern:db-placeholder-cache-injection
title: SQL injection via query modes and dollar-quoted literals
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [database, sql-injection, pgx, postgresql, placeholder, query-mode]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-05
symptom: >-
  User-controlled values end up in SQL whose text is assembled with
  `$tag$...$tag$` literals (PL/pgSQL functions, dynamic queries), combined
  with query modes that interpret placeholders
  (`QueryExecModeCacheStatement`/`Describe` by default in pgx). A placeholder
  recognized outside an expected literal becomes an injection.
detect: >-
  - `$1..$n` or concatenated fragments inside text meant to be a dollar-quoted
    literal (`$body$ ... $body$`).
  - `QueryExecModeCacheStatement` active (pgx default) with dynamically built
    queries.
  - Advisory GO-2026-5004 / GHSA-j88v-2chj-qfwx (fixed in pgx v5.9.2): SQLi by
    placeholder confusion with dollar-quoted literals in the simple protocol.
problem: >-
  Parameterized queries protect values, not the SQL text: if the SQL itself
  contains uncontrolled fragments (`$tag$` literals, assembled clauses), an
  attacker can close the literal and inject commands. This bug class reappeared
  3 times on pgx in 2 years (CVE-2024-27304, CVE-2026-33815/33816,
  GO-2026-5004).
fix: >-
  Pin pgx ≥ v5.9.2; never place a controlled value inside a dollar-quoted
  literal; for dynamic queries (filters/ORDER BY), choose `QueryExecModeExec`
  or validate each fragment against a whitelist (see
  `pattern:antipattern:db-codegen-dynamic-queries` for the sqlc case). Test
  with adversarial inputs (`'$q$'; DROP ...`).
when_ok: >-
  Static SQL (no `$tag$` literal nor assembled fragment) + parameterized
  queries: the default mode is safe.
relationships:
  references:
    - https://github.com/jackc/pgx/security/advisories/GHSA-j88v-2chj-qfwx
    - https://github.com/jackc/pgx/security/advisories/GHSA-mrww-27vc-gghv
    - https://osv.dev/vulnerability/GO-2026-4772
  uses:
    - pattern:antipattern:db-codegen-dynamic-queries
  validated_by: []
