id: pattern:antipattern:db-raw-transactions
title: Raw BEGIN/COMMIT SQL instead of the transaction API
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [database, sql, transactions, correctness]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  `db.Exec("BEGIN")` / `db.Exec("COMMIT")` or `db.Exec("ROLLBACK")` chained
  manually, with error and state management by the application.
detect: >-
  - `Exec("BEGIN")`/`Exec("COMMIT")` in the code (grep).
  - Absence of `*sql.Tx` in signatures; implicit transaction state.
problem: >-
  The official documentation says it: in concurrent programming, raw
  BEGIN/COMMIT can leave the database in an unpredictable state — the
  underlying connection can be reused by another goroutine between two Exec
  calls, and rollback is not guaranteed on error (locked connection, open
  transaction).
fix: >-
  Use the API: `tx, err := db.BeginTx(ctx, nil)`, all operations on `tx`,
  `defer tx.Rollback()` (safe after commit) then `tx.Commit()`. Commit
  explicitly and check the Commit error; Rollback in defer covers the error
  paths.
when_ok: >-
  Never raw BEGIN/COMMIT in application code; the database/sql API covers
  simple transactions. Savepoints (nested transactions) are not part of the
  API: they require driver-dependent raw SQL (SAVEPOINT/RELEASE), to
  encapsulate behind a dedicated, tested function.
relationships:
  references:
    - https://go.dev/doc/database/execute-transactions
    - https://pkg.go.dev/database/sql
  uses: []
  validated_by: []
