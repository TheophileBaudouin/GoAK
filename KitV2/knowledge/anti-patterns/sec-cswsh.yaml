---
id: pattern:antipattern:sec-cswsh
title: Cross-Site WebSocket Hijacking — missing origin validation
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [security, websocket, origin, csrf, cswsh]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  A WebSocket server accepts the handshake without checking the Origin
  header; the connection relies on an HTTP session cookie; a malicious site
  can open a WebSocket connection to the server and speak on behalf of the
  authenticated user.
detect: >-
  - In coder/websocket: `websocket.Accept(w, r, nil)` without
    `AcceptOptions.OriginPatterns`, or `InsecureSkipVerify: true`.
  - No `Origin` header check in the handshake handler.
  - The WebSocket service reuses the website's cookie authentication.
problem: >-
  The browser does not apply the same-origin policy to WebSockets: it is up
  to the server to validate the Origin at the handshake (WSTG, CWE-1385).
  Without this validation, an attacker hijacks the established session
  (CSWSH) to read data, issue commands or exhaust connections — since the
  browser's origin IP is legitimate, network protections see nothing.
fix: >-
  Check the Origin header at the handshake: in coder/websocket, provide
  `OriginPatterns` (an explicit allowlist of origins) instead of
  `InsecureSkipVerify`; otherwise, reject the handshake when the Origin is
  not a controlled domain. Do not rely on a cookie for WebSocket auth
  without a non-predictable token (OWASP: use a CSRF/randomized token).
  Serve over wss/TLS.
when_ok: >-
  Origin validation may be omitted when the client is native (outside the
  browser) and authentication does not rely on session cookies — then
  document why the Origin is not a boundary.
relationships:
  references:
    - https://cheatsheetseries.owasp.org/cheatsheets/WebSocket_Security_Cheat_Sheet.html
    - https://cwe.mitre.org/data/definitions/1385.html
    - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/11-Client-side_Testing/10-Testing_WebSockets
    - https://github.com/coder/websocket/blob/master/accept.go
