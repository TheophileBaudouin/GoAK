id: pattern:antipattern:db-select-star
title: SELECT * in production — unnamed columns
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [database, sql, performance, schema]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  `SELECT * FROM users` in application code, or a `rows.Scan` that depends on
  the order and the number of columns of the table.
detect: >-
  - Occurrences of `SELECT *` outside exploration queries (SQL grep).
  - `rows.Columns()` used to adapt the scan dynamically.
problem: >-
  `SELECT *` transfers all columns (including blob, large json, columns added
  later), prevents the optimizer from using covering indexes, and breaks
  `Scan` as soon as a column is added/removed — the contract becomes implicit
  and fragile.
fix: >-
  Explicitly list the needed columns (`SELECT id, name, …`) and map to named
  fields. For large objects, project the heavy columns only when needed.
  Re-evaluate the list at every schema change (generate queries from types or
  models).
when_ok: >-
  `SELECT *` is justified in interactive exploration (psql), demonstrations,
  or views whose columns are truly all consumed and controlled; not in
  production code.
relationships:
  references:
    - https://sonra.io/mastering-sql-how-to-detect-and-avoid-34-common-sql-antipatterns/
  uses: []
  validated_by: []
