id: pattern:antipattern:test-over-mocking
title: Mocking everything — the fake becomes the system
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [testing, mocking, unit-test, integration]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  Every dependency is mocked (entire layers: repository, HTTP client,
  filesystem, clock), tests verify interactions between mocks and no longer
  touch any real implementation.
detect: >-
  - A test suite with no integration test at all; mocks of layers without
    logic (simple relay).
  - Tests passing while the real system breaks (false contract between mock
    and implementation).
  - Mock configuration as complex as the tested code.
problem: >-
  Mocks only verify programmed expectations: they freeze the internal API
  (see test-implementation-details), detect neither real contract errors nor
  integration regressions, and give false confidence. The test hierarchy
  (pyramid) requires more real low-level tests than mocks.
fix: >-
  Mock only the unstable boundaries (network, clock, I/O) with simple data
  fakes; test logic against real implementations (test database,
  httptest.Server for HTTP). Verify contracts with a minimal integration
  test (see recipe-sqlite-sqlc, recipe-rest-chi). The kit prefers pure seams
  (testable functions) to mock frameworks.
when_ok: >-
  A mock is justified for an external dependency that is not reproducible in
  tests (SaaS provider, network); it must reflect the real contract, not an
  ad hoc expectation.
relationships:
  references:
    - http://xunitpatterns.com/Mock%20Object.html
    - https://testsmells.org/
  uses: []
  validated_by: []
