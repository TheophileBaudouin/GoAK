id: pattern:antipattern:db-pool-misconfig
title: Misconfigured connection pool (defaults or leaks)
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [database, sql, pool, connection, performance]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  `sql.Open` without `SetMaxOpenConns`/`SetMaxIdleConns`/`SetConnMaxLifetime`,
  rows not closed, transactions holding the connection too long.
detect: >-
  - `sql.Open` without pool settings (the default MaxOpenConns = unlimited
    exhausts the DBMS max_connections).
  - `rows`/`stmt` never closed (connection leak — see go-ignored-error).
  - `MaxIdleConns` > `MaxOpenConns` or 0, without `ConnMaxLifetime`.
  - "too many connections" errors / pool timeouts under load.
problem: >-
  `sql.Open` is lazy (no connection opened at call time) and the defaults are
  dangerous: unlimited pool, connections aging without `ConnMaxLifetime`
  (failures after failover/firewall), leaks from unclosed rows. The
  consequences (blocking, DB timeouts) only appear under load.
fix: >-
  Configure explicitly: `SetMaxOpenConns`, `SetMaxIdleConns`,
  `SetConnMaxIdleTime`, `SetConnMaxLifetime` consistent with the DBMS. Always
  `defer rows.Close()` (consume the error), close stmt after use, and cut
  long transactions short. Verify with `db.Stats()` (InUse, Idle, WaitCount)
  under test load.
when_ok: >-
  The exact values depend on the DBMS and the load; the rule is to set them
  (never the defaults), not a universal value.
relationships:
  references:
    - https://pkg.go.dev/database/sql
    - https://github.com/golang/go/issues/27434
  uses: []
  validated_by: []
