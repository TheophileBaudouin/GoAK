id: pattern:antipattern:db-function-on-column
title: Function applied to an indexed column in the WHERE clause
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [database, sql, performance, index]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  `WHERE date(created_at) = '2026-08-04'`, `WHERE lower(email) = 'x@y.z'`,
  `WHERE YEAR(birth) = 1990` — the function prevents the use of the index on
  the column.
detect: >-
  - Slow queries whose execution plan shows a SEQ SCAN / FULL TABLE SCAN on an
    indexed column.
  - `EXPLAIN`: the index does not appear although the column is indexed.
problem: >-
  A function on the column makes the index unusable: the DBMS scans all rows
  and computes the function on each one. The cost goes from logarithmic to
  linear as soon as the table grows — it is the #1 cause of queries that
  "suddenly slow down".
fix: >-
  Express the condition on the bare column: `created_at >= ? AND created_at <
  ?` (range), `email = ?` with normalization at write time (storing
  lowercase), or an expression index if the DBMS supports it
  (`CREATE INDEX ON t (lower(email))`). Keep the function off the column.
when_ok: >-
  On very small tables (< a few thousand rows) the impact is nil; the rule
  becomes critical at scale — design for it from the start.
relationships:
  references:
    - https://sonra.io/mastering-sql-how-to-detect-and-avoid-34-common-sql-antipatterns/
  uses: []
  validated_by: []
