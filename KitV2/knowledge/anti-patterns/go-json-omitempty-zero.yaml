id: pattern:antipattern:go-json-omitempty-zero
title: omitempty hiding significant zeros
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, json, api, serialization, zero-value]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  `json:"count,omitempty"`, `json:"found,omitempty"`, `json:"score,omitempty"`
  on fields where 0/false is a valid business value — the client receives a
  missing field instead of `0`/`false`.
detect: >-
  - `omitempty` tag on numeric, boolean, or duration fields whose zero has
    meaning (counters, indicators, deadlines).
  - API tests that do not assert the presence/absence of the zero field.
problem: >-
  The zero is silently omitted: the consumer can no longer distinguish
  "absent" from "zero" — counters shown as zero by default, conditions false
  by default, implicit API contracts that change on refactor. A field's
  semantics must not depend on the serialization tag.
fix: >-
  Remove `omitempty` when the zero is significant. To explicitly distinguish
  absent vs zero, use a pointer (`*int`) or an optional `datatypes`/wrapper,
  and decide field by field: `omitempty` for optional display options, never
  for business facts.
when_ok: >-
  `omitempty` fits truly optional fields (descriptions, extensions, rendering
  fields) where absence is the intended default value.
relationships:
  references:
    - https://pkg.go.dev/encoding/json
    - https://100go.co/
  uses: []
  validated_by: []
