id: pattern:antipattern:arch-shared-database
title: Database shared between services
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [architecture, microservices, database, coupling]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  Several services write/read the same tables: single central schema,
  coordinated migrations, implicit data contracts between services through the
  database.
detect: >-
  - Two services (or more) with migrations on the same schema.
  - Column modification requiring a coordinated deployment.
  - DB locks/contention attributable to cross-service accesses.
problem: >-
  The shared database reintroduces the coupling decomposition was supposed to
  eliminate: services are bound by the schema, changes are coordinated, the
  database becomes the bottleneck and the single point of failure — it is the
  main symptom of the distributed monolith (see arch-distributed-monolith).
fix: >-
  Give each service exclusive ownership of its data (database-per-service):
  other services access it through its API or events (read projection,
  lightweight CQRS). Shared views are exposed by the owning service, never by
  direct access.
when_ok: >-
  For a small organization, a shared database with per-service separated
  schemas (one user per schema) is a pragmatic compromise; the strong rule
  applies when services evolve independently.
relationships:
  references:
    - https://algomaster.io/learn/microservices/anti-patterns-reference
    - https://dzone.com/articles/antipatterns-of-microservices
  uses: []
  validated_by: []
