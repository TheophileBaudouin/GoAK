---
id: pattern:antipattern:sec-ip-trust
title: Trusting the client IP from unverified proxy headers
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [security, http, proxy, ip-spoofing, rate-limit, middleware]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  The "client" IP is derived from X-Forwarded-For, X-Real-IP, or Forwarded
  without verifying that the proxy that wrote the header is actually the one
  you control; chi's RealIP middleware is used; rate limiting, audit, or
  geo-filtering rely on this IP.
detect: >-
  - `middleware.RealIP` from go-chi/chi: deprecated, 3 open spoofing
    advisories against it (GHSA-9g5q-2w5x-hmxf, GHSA-rjr7-jggh-pgcp,
    GHSA-3fxj-6jh8-hvhx) — look for the call in the middleware stack.
  - Direct reads of `r.Header.Get("X-Forwarded-For")` in application code.
  - No `ClientIPFrom*` configured while the app sits behind a proxy.
problem: >-
  A client can forge X-Forwarded-For (e.g. `X-Forwarded-For: 127.0.0.1`):
  only the segments appended by proxies you control are trustworthy (MDN). A
  forged IP bypasses per-IP rate limiting, falsifies audit, defeats
  geo-protections, and subverts decisions based on network identity — with
  no trace of intrusion.
fix: >-
  Choose exactly ONE `ClientIPFrom*` middleware from chi (v5.3+) according to
  the topology: direct Internet exposure → `ClientIPFromRemoteAddr`; behind a
  single known proxy (nginx, Cloudflare) → `ClientIPFromHeader` with the
  exact header name; behind a set of known proxy CIDRs → `ClientIPFromXFF`.
  Never trust header segments your proxy does not control, and treat any
  header-derived IP as untrustworthy for a security decision when the
  topology is unknown.
when_ok: >-
  A forgeable IP is acceptable only if no security decision (rate limiting,
  authorization, access audit) depends on it — then document this
  untrustworthiness explicitly.
relationships:
  references:
    - https://github.com/go-chi/chi/security/advisories/GHSA-9g5q-2w5x-hmxf
    - https://github.com/go-chi/chi/security/advisories/GHSA-rjr7-jggh-pgcp
    - https://github.com/go-chi/chi/security/advisories/GHSA-3fxj-6jh8-hvhx
    - https://github.com/go-chi/chi/pull/967
    - https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/X-Forwarded-For
    - https://owasp.org/www-community/pages/attacks/ip_spoofing_via_http_headers.html
  uses: []
  validated_by: []
