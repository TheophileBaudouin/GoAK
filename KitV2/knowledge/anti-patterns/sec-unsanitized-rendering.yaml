---
id: pattern:antipattern:sec-unsanitized-rendering
title: Rendu HTML non sanitisé — markdown et templates sur entrée non contrôlée
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [security, xss, markdown, rendering, html, sanitization, owasp]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-05
symptom: >-
  Du markdown ou un template est converti en HTML et injecté tel quel dans une
  page, y compris pour du contenu utilisateur (commentaires, profils, tickets).
  Le code passe du markdown brut au DOM sans étape de nettoyage.
detect: >-
  - `goldmark.Convert(...)` (ou équivalent) sans sanitizer en aval sur la
    sortie ; blocs HTML du markdown rendus (`<script>`, `onclick=…`).
  - Templates (html/template est sûr par défaut, mais) un rendu assemblé
    depuis des fragments non échappés ou `template.HTML(...)` sur entrée
    non contrôlée.
  - Advisory CVE-2026-5160 / GO-2026-5320 (goldmark, fix ≥ 1.7.17) : la classe
    de bug est récurrente dans les parseurs markdown.
problem: >-
  Le rendu d'entrées non contrôlées en HTML sans sanitisation est une porte
  XSS ouverte : un utilisateur peut injecter du script exécuté dans le
  contexte d'autres utilisateurs (session, CSRF, exfiltration). Les parseurs
  markdown rendent par défaut les blocs HTML bruts — c'est un contrat du
  format, pas un bug du parser.
fix: >-
  Sanitiser la sortie avec une liste blanche (bluemonday) ou désactiver le
  rendu des blocs HTML quand le markdown ne doit pas les contenir ; ne jamais
  convertir du markdown non contrôlé directement en `template.HTML`. Vérifier
  la version minimale du parser (goldmark ≥ 1.7.17). Tester avec des entrées
  adverses (`<img onerror=…>`, `<script>`, attributs event).
when_ok: >-
  Une entrée de confiance (contenu éditorial interne, markdown contrôlé à
  l'écriture) peut être rendue sans sanitizer — la frontière de confiance
  doit être explicite et documentée.
relationships:
  references:
    - https://osv.dev/vulnerability/GO-2026-5320
    - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
