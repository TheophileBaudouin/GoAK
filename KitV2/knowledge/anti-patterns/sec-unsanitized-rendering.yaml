---
id: pattern:antipattern:sec-unsanitized-rendering
title: Unsanitized HTML rendering — markdown and templates on uncontrolled input
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [security, xss, markdown, rendering, html, sanitization, owasp]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-05
symptom: >-
  Markdown or a template is converted to HTML and injected as-is into a page,
  including for user content (comments, profiles, tickets). The content goes
  from raw markdown to the DOM without a cleaning step.
detect: >-
  - `goldmark.Convert(...)` (or equivalent) without a downstream sanitizer on
    the output; markdown HTML blocks rendered (`<script>`, `onclick=…`).
  - Templates (html/template is safe by default, but) a render assembled from
    unescaped fragments or `template.HTML(...)` on uncontrolled input.
  - Advisory CVE-2026-5160 / GO-2026-5320 (goldmark, fix ≥ 1.7.17): this bug
    class is recurrent in markdown parsers.
problem: >-
  Rendering uncontrolled input as HTML without sanitization is an open XSS
  door: a user can inject script executed in other users' contexts (session,
  CSRF, exfiltration). Markdown parsers render raw HTML blocks by default —
  this is a format contract, not a parser bug.
fix: >-
  Sanitize the output with a whitelist (bluemonday) or disable HTML block
  rendering when the markdown must not contain them; never convert
  uncontrolled markdown directly to `template.HTML`. Check the parser's
  minimum version (goldmark ≥ 1.7.17). Test with adversarial inputs
  (`<img onerror=…>`, `<script>`, event attributes).
when_ok: >-
  A trusted input (internal editorial content, markdown controlled at write
  time) may be rendered without a sanitizer — the trust boundary must be
  explicit and documented.
relationships:
  references:
    - https://osv.dev/vulnerability/GO-2026-5320
    - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
  uses:
    - pattern:security:fail-closed-auth
  validated_by: []
