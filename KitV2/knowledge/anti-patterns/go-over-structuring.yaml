id: pattern:antipattern:go-over-structuring
title: Over-structuring — copy of golang-standards/project-layout
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, project-structure, layout, simplicity]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  A `cmd/`, `internal/`, `pkg/`, `scripts/`, `configs/`, `deploy/`, `docs/`…
  tree copied from a generic template for a project that fits in a few
  packages, with empty or single-file packages.
detect: >-
  - Directories with a single file or re-exports.
  - `pkg/` containing code used only internally.
  - Circular imports avoided by creating catch-all "util" packages.
problem: >-
  `golang-standards/project-layout` is not an official standard (Go team):
  the official module organization doc recommends staying simple and creating
  only the needed packages. Over-structuring increases the navigation cost,
  encourages catch-all packages, and dilutes responsibilities.
fix: >-
  Start minimal: everything at the module root or in a root package,
  sub-packages only when an import boundary is real (use `internal/` for
  private code, `cmd/` for multiple binaries). Structure by code
  responsibility, not by copying a template. Add directories when size
  justifies it, never in anticipation.
when_ok: >-
  The kit's starter templates (monolith, api-service) provide a reasonable
  starting structure; the anti-pattern is keeping their empty directories
  beyond the need. Kit philosophy: `rules/core/philosophy`.
relationships:
  references:
    - https://go.dev/doc/modules/layout
    - https://100go.co/
  uses: []
  validated_by: []
