id: pattern:antipattern:go-error-string-matching
title: Comparing errors by string instead of errors.Is/As
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, errors, sentinel, wrapping, correctness]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  `if strings.Contains(err.Error(), "not found")` or comparing `err.Error()`
  against an exact message to decide a code path.
detect: >-
  - Occurrences of `.Error()` in conditions or switches.
  - `strings.Contains/HasPrefix` on `err.Error()` (grep `err.Error()`).
  - Tests that break as soon as an error message is reworded.
problem: >-
  Messages are display details, not a contract: they change, they are
  localized, and a message can be wrapped several times by `%w`. String
  comparison breaks on refactor and ignores the error chain (`errors.Is`
  traverses the `%w` wrappers).
fix: >-
  Define sentinels (`var ErrNotFound = errors.New("not found")`) and error
  types, then `errors.Is(err, ErrNotFound)` or `errors.As` for types. If a
  string must be inspected (error from a third-party package without a
  sentinel), isolate the inspection in a dedicated, documented function.
when_ok: >-
  Message inspection remains a last resort for unstructured third-party
  package errors; project it into a local sentinel as early as possible.
relationships:
  references:
    - https://go.dev/blog/errors-are-values
    - https://100go.co/
  uses: []
  validated_by: []
