id: pattern:antipattern:go-error-string-matching
title: Comparaison d'erreurs par chaîne au lieu de errors.Is/As
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, errors, sentinel, wrapping, correctness]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  `if strings.Contains(err.Error(), "not found")` ou comparaison de
  `err.Error()` contre un message exact pour décider d'un chemin de code.
detect: >-
  - Occurrences de `.Error()` dans des conditions ou des switch.
  - `strings.Contains/HasPrefix` sur `err.Error()` (grep `err.Error()`).
  - Tests qui cassent dès qu'un message d'erreur est reformulé.
problem: >-
  Les messages sont des détails d'affichage, pas un contrat : ils changent, sont
  localisés, et un message peut être emballé par `%w` plusieurs fois. La
  comparaison par chaîne casse au refactor et ignore la chaîne d'erreurs
  (`errors.Is` traverse les `%w`).
fix: >-
  Définir des sentinelles (`var ErrNotFound = errors.New("not found")`) et des
  types d'erreur, puis `errors.Is(err, ErrNotFound)` ou `errors.As` pour les
  types. Si une chaîne doit être inspectée (erreur d'un paquet tiers sans
  sentinelle), isoler l'inspection dans une fonction dédiée et documentée.
when_ok: >-
  L'inspection de message reste un dernier recours pour les erreurs de paquets
  tiers non structurées ; la projeter dans un sentinelle local le plus tôt
  possible.
relationships:
  references:
    - https://go.dev/blog/errors-are-values
    - https://100go.co/
  uses: []
  validated_by: []
