id: pattern:antipattern:go-string-concat-loop
title: String concatenation in a loop with +=
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, performance, strings, builder, allocation]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  `s := ""` then `s += part` in a loop (assembling CSV, SQL, HTML, queries) —
  O(n²) and one allocation per iteration.
detect: >-
  - `+=` on a string in a loop body.
  - Benchmarks showing quadratic time when the input size doubles.
  - Allocation profile (pprof allocs) with a peak on strings.
problem: >-
  Go strings are immutable: each `+=` copies the whole string. For n
  iterations, the cost is O(n²) with n allocations — visible from a few
  thousand iterations, catastrophic in a data pipeline.
fix: >-
  Use `strings.Builder` (`var b strings.Builder; b.WriteString(part)`) or
  `strings.Join` for fixed separators. Builder amortizes reallocation;
  preallocate with `b.Grow(n)` when the size is known. Alternative:
  `slices`/`bytes.Buffer` depending on the context (binary).
when_ok: >-
  A concatenation of 2-3 strings outside a loop (`a + b + c`) is idiomatic
  and without measurable impact; the rule only concerns loops and hot paths.
relationships:
  references:
    - https://go.dev/blog/strings
    - https://gobench.dev/string-concatination
  uses: []
  validated_by: []
