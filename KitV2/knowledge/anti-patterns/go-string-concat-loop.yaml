id: pattern:antipattern:go-string-concat-loop
title: Concaténation de chaînes en boucle avec +=
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, performance, strings, builder, allocation]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  `s := ""` puis `s += part` dans une boucle (assemblage de CSV, SQL, HTML,
  requêtes) — O(n²) et allocation par itération.
detect: >-
  - `+=` sur une chaîne dans un corps de boucle.
  - Benchmarks montrant un temps quadratique quand la taille des entrées double.
  - Profil d'allocation (pprof allocs) avec un pic sur les strings.
problem: >-
  Les chaînes Go sont immuables : chaque `+=` copie la chaîne entière. Pour n
  itérations, le coût est O(n²) avec n allocations — visible dès quelques
  milliers d'itérations, catastrophique en pipeline de données.
fix: >-
  Utiliser `strings.Builder` (`var b strings.Builder; b.WriteString(part)`) ou
  `strings.Join` pour les séparateurs fixes. Builder amortit la réallocation ;
  préallouer avec `b.Grow(n)` quand la taille est connue. Alternative :
  `slices`/`bytes.Buffer` selon le contexte (binaire).
when_ok: >-
  Une concaténation de 2-3 chaînes hors boucle (`a + b + c`) est idiomatique et
  sans impact mesurable ; la règle ne concerne que les boucles et les chemins
  chauds.
relationships:
  references:
    - https://go.dev/blog/strings
    - https://gobench.dev/string-concatination
  uses: []
  validated_by: []
