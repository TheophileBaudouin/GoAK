id: pattern:antipattern:go-ignored-error
title: Ignored error — return value discarded
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, errors, correctness, silent-failure]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  `_ = f()`, `f()` without assignment while f returns an error, or
  `defer db.Close()` without consuming the return value.
detect: >-
  - `errcheck` (golangci-lint) flags every unchecked error — the kit gate
    requires 0 issues.
  - Look for `_ = ` on calls whose error is significant (write, close,
    commit).
problem: >-
  Go treats errors as values; discarding them produces silent failures
  (truncated write, uncommitted transaction, under-billing) that only
  manifest later, with no link to the cause.
fix: >-
  Always consume the error: propagate it (`return err`), log it with context,
  or handle it explicitly. For closures: `defer func() { _ =
  rows.Close() }()` (explicit consumption, satisfies errcheck and gosec G104).
  Mask only if the error is truly inconsequential — documented.
when_ok: >-
  Some read-only closures may ignore the error if the result has already been
  fully consumed and verified; the `_ =` must then be intentional and
  commented.
relationships:
  references:
    - https://100go.co/
    - https://go.dev/wiki/CodeReviewComments
  uses: []
  validated_by: []
