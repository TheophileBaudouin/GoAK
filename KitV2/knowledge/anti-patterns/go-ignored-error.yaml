id: pattern:antipattern:go-ignored-error
title: Erreur ignorée — valeur de retour jetée
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, errors, correctness, silent-failure]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  `_ = f()`, `f()` sans affectation alors que f renvoie une erreur, ou
  `defer db.Close()` sans consommation de la valeur de retour.
detect: >-
  - `errcheck` (golangci-lint) signale toute erreur non vérifiée — le gate du
    kit exige 0 issue.
  - Chercher `_ = ` sur des appels dont l'erreur est significative (write,
  close,
    commit).
problem: >-
  Go traite les erreurs comme des valeurs ; les jeter produit des échecs
  silencieux (écriture tronquée, transaction non commitée, sous-facturation) qui
  ne se manifestent que plus tard, sans lien avec la cause.
fix: >-
  Toujours consommer l'erreur : la propager (`return err`), la logger avec
  contexte, ou la gérer explicitement. Pour les fermetures : `defer func() { _ =
  rows.Close() }()` (consommation explicite, satisfait errcheck et gosec G104).
  Ne masquer que si l'erreur est réellement sans conséquence — documenté.
when_ok: >-
  Certaines fermetures en lecture seule peuvent ignorer l'erreur si le résultat
  a déjà été entièrement consommé et vérifié ; le `_ =` doit alors être
  intentionnel et commenté.
relationships:
  references:
    - https://100go.co/
    - https://go.dev/wiki/CodeReviewComments
  uses: []
  validated_by: []
