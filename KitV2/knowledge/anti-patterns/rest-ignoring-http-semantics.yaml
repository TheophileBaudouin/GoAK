id: pattern:antipattern:rest-ignoring-http-semantics
title: API qui ignore les sémantiques HTTP (statuts, cache, types)
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [http, rest, api, status-codes, caching]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  Toutes les réponses renvoient 200 (ou 500 pour tout échec), pas
  d'en-têtes de cache ni ETag, Content-Type incohérent avec le corps,
  authentification ajoutée après coup sous forme de paramètre.
detect: >-
  - `http.Error` générique systématique (200/500) sans mapping d'erreur.
  - Aucun `Cache-Control`/`ETag`/`Vary` sur les ressources publiques.
  - Négociation de type ignorée (`Accept`), corps JSON renvoyé en text/plain.
problem: >-
  Les statuts et en-têtes sont le contrat du protocole : les ignorer casse les
  clients standards (caches, proxies, libs), masque les erreurs réelles
  (impossible de distinguer 4xx de 5xx), et force chaque client à inventer sa
  propre détection d'erreur.
fix: >-
  Mapper les erreurs aux statuts (400 validation, 401/403 auth, 404, 409
  conflit, 429 rate limit, 5xx serveur), renvoyer `Cache-Control`/`ETag`/
  `If-None-Match` pour le cache, fixer `Content-Type: application/json` et
  honorer `Accept`. Exposer une réponse d'erreur structurée
  (`{"error": {"code": …, "message": …}}`).
when_ok: >-
  Les microservices internes peuvent alléger la négociation de contenu ; les
  statuts et le cache restent obligatoires dès qu'un client externe existe.
relationships:
  references:
    - https://www.infoq.com/articles/rest-anti-patterns
    - https://www.innoq.com/blog/st/2008/07/rest-anti-patterns/
  uses: []
  validated_by: []
