id: pattern:antipattern:rest-ignoring-http-semantics
title: API that ignores HTTP semantics (statuses, cache, types)
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [http, rest, api, status-codes, caching]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  All responses return 200 (or 500 for any failure), no cache headers or
  ETag, Content-Type inconsistent with the body, authentication added
  afterwards as a parameter.
detect: >-
  - Systematic generic `http.Error` (200/500) without error mapping.
  - No `Cache-Control`/`ETag`/`Vary` on public resources.
  - Type negotiation ignored (`Accept`), JSON body returned as text/plain.
problem: >-
  Statuses and headers are the protocol contract: ignoring them breaks
  standard clients (caches, proxies, libs), hides real errors (4xx cannot be
  distinguished from 5xx), and forces every client to invent its own error
  detection.
fix: >-
  Map errors to statuses (400 validation, 401/403 auth, 404, 409 conflict,
  429 rate limit, 5xx server), return `Cache-Control`/`ETag`/`If-None-Match`
  for caching, set `Content-Type: application/json` and honor `Accept`.
  Expose a structured error response
  (`{"error": {"code": …, "message": …}}`).
when_ok: >-
  Internal microservices may lighten content negotiation; statuses and
  caching remain mandatory as soon as an external client exists.
relationships:
  references:
    - https://www.infoq.com/articles/rest-anti-patterns
    - https://www.innoq.com/blog/st/2008/07/rest-anti-patterns/
  uses: []
  validated_by: []
