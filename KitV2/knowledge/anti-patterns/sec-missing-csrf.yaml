---
id: pattern:antipattern:sec-missing-csrf
title: Cookie sessions without CSRF protection
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [security, csrf, cookies, sessions, owasp, same-site, web]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-05
symptom: >-
  A web app with cookie-based authentication (scs, gorilla/sessions) exposes
  state-changing endpoints (POST /delete, /transfer, /settings) without a
  CSRF token or origin check; the session cookie has no SameSite configured.
detect: >-
  - POST forms without a CSRF token (double-submit or synchronizer token).
  - No Origin/Referer header validation on mutations.
  - Session cookie without `SameSite` (or SameSite=None without need).
  - Missing tests: a forged cross-origin request succeeds.
problem: >-
  A third-party site can trigger cross-site requests that carry the session
  cookie (the browser sends it automatically): deletion, transfer, password
  change without the user's knowledge (CSRF attack, dedicated OWASP cheat
  sheet). SameSite=Strict mitigates but does not cover every context
  (subdomains, SameSite=Lax on GET).
fix: >-
  Always: cookie `Secure` + `HttpOnly` + `SameSite=Strict` (or Lax when
  external navigation is needed). On state-changing endpoints: a CSRF token
  (synchronizer token or double-submit) or strict Origin/Referer validation;
  validate on the server, never client-side only. Test with a forged
  cross-origin request.
when_ok: >-
  Bearer-token API (JWT in a header, never in a cookie): no automatic cookie
  → reduced CSRF surface. GET-only forms without side effects: no mutation
  to protect.
relationships:
  references:
    - https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html
  uses:
