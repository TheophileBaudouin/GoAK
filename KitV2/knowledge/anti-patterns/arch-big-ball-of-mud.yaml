id: pattern:antipattern:arch-big-ball-of-mud
title: Big Ball of Mud — architecture sans frontières
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [architecture, design, coupling, maintainability]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  Un système dont la structure est dictée par l'expédience : packages qui
  s'importent librement, couches mélangées (HTTP dans le domaine, SQL dans les
  handlers), « glue code » omniprésent.
detect: >-
  - Dépendances circulaires entre packages (outil d'analyse d'imports).
  - Aucune règle de dépendance ; les packages « util » partagés grossissent.
  - Chaque changement touche plusieurs couches sans relation directe.
problem: >-
  Le papier fondateur (Foote & Yoder, PLoP 1997) décrit la BBoM comme une
  architecture « de facto » : chaque décision locale est rapide, mais le coût
  d'entretien et de compréhension croît sans borne, la testabilité chute, et
  les refactors majeurs deviennent impossibles sans réécriture.
fix: >-
  Tracer des frontières explicites : le domaine ne dépend pas de
  l'infrastructure (ports/adapters légers), l'import direction est contraint
  (`internal/`), les dépendances entre packages sont acycliques et vérifiées
  (voir rules/core). Introduire une règle de dépendance simple et la faire
  respecter par la structure, pas par la discipline.
when_ok: >-
  Un prototype ou un script unique peut être « dégueulasse » à dessein ; la
  BBoM devient intolérable quand deux développeurs ou plus maintiennent le
  système simultanément.
relationships:
  references:
    - https://www.plopcon.org/pastplops/plop97/Proceedings/foote.pdf
  uses: []
  validated_by: []
