id: pattern:antipattern:arch-big-ball-of-mud
title: Big Ball of Mud — architecture without boundaries
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [architecture, design, coupling, maintainability]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  A system whose structure is dictated by expedience: packages that import
  each other freely, mixed layers (HTTP in the domain, SQL in the handlers),
  omnipresent "glue code".
detect: >-
  - Circular dependencies between packages (import analysis tool).
  - No dependency rule; shared "util" packages keep growing.
  - Every change touches several layers without a direct relationship.
problem: >-
  The founding paper (Foote & Yoder, PLoP 1997) describes the BBoM as a
  "de facto" architecture: every local decision is fast, but the cost of
  maintenance and comprehension grows without bound, testability drops, and
  major refactors become impossible without a rewrite.
fix: >-
  Draw explicit boundaries: the domain does not depend on the infrastructure
  (lightweight ports/adapters), the import direction is constrained
  (`internal/`), package dependencies are acyclic and verified (see
  rules/core). Introduce a simple dependency rule and enforce it through the
  structure, not through discipline.
when_ok: >-
  A prototype or a single script may be deliberately "messy"; the BBoM becomes
  intolerable when two or more developers maintain the system simultaneously.
relationships:
  references:
    - https://www.plopcon.org/pastplops/plop97/Proceedings/foote.pdf
  uses: []
  validated_by: []
