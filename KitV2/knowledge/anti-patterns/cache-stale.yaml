id: pattern:antipattern:cache-stale
title: Stale cache — inconsistency with the source
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [caching, consistency, invalidation, redis]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  The cache serves outdated values after a source update: prices, availability,
  states that do not change while the data has changed, without an invalidation
  strategy.
detect: >-
  - Long TTL without an invalidation mechanism on write.
  - Updates written directly to the database without purging/updating the
    cache.
  - Inconsistencies observed between the API and the source (tests or
    operations).
problem: >-
  A cache that drifts serves false facts (wrong prices, oversold stock); the
  cache consistency discipline (redis.io) is to bound this drift according to
  the business requirement. Uncontrolled drift erodes trust in the whole
  system.
fix: >-
  Invalidate or update the cache on write (write-through, event-driven
  invalidation), choose a TTL consistent with the business freshness
  tolerance, and differentiate data (stable vs volatile). For critical data,
  validate the age (stale-while-revalidate with a threshold) and alert on
  drift.
when_ok: >-
  Some data tolerates deferred freshness (content, aggregates); the
  anti-pattern is drift without bound or explicit strategy, not the presence
  of a cache.
relationships:
  references:
    - https://redis.io/blog/cache-consistency-strategies/
  uses: []
  validated_by: []
