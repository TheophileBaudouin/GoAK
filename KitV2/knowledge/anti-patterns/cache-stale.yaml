id: pattern:antipattern:cache-stale
title: Cache périmé — incohérence avec la source
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [caching, consistency, invalidation, redis]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  Le cache sert des valeurs obsolètes après une mise à jour de la source :
  prix, disponibilité, états qui ne changent pas alors que la donnée a
  changé, sans stratégie d'invalidation.
detect: >-
  - TTL long sans mécanisme d'invalidation à l'écriture.
  - Mises à jour écrites directement en base sans purge/mise à jour du cache.
  - Incohérences constatées entre l'API et la source (tests ou opérations).
problem: >-
  Un cache qui dérive sert des faits faux (prix erronés, stock dépassé) ; la
  discipline de cohérence du cache (redis.io) est de borner cette dérive
  selon l'exigence métier. La dérive incontrôlée érode la confiance dans le
  système entier.
fix: >-
  Invalider ou mettre à jour le cache à l'écriture (write-through, invalidation
  par événement), choisir un TTL cohérent avec la tolérance de fraîcheur
  métier, et différencier les données (stable vs volatile). Pour les données
  critiques, valider l'âge (stale-while-revalidate avec seuil) et alerter
  sur la dérive.
when_ok: >-
  Certaines données tolèrent la fraîcheur différée (contenu, agrégats) ;
  l'anti-pattern est la dérive sans borne ni stratégie explicite, pas la
  présence d'un cache.
relationships:
  references:
    - https://redis.io/blog/cache-consistency-strategies/
  uses: []
  validated_by: []
