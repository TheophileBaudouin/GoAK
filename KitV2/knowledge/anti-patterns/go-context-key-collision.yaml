id: pattern:antipattern:go-context-key-collision
title: Exported or string-typed context key
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, context, values, collision, correctness]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  `context.WithValue(ctx, "user", u)` with a key of type `string` or an
  exported type defined in another package.
detect: >-
  - `context.WithValue` whose key is a string literal or an exported type
    (lint: `revive` rule `context-key-type`).
  - Search for context keys shared between packages.
problem: >-
  The official documentation is explicit: keys must be of a type defined in
  the caller's package and unexported. A string or exported key creates silent
  collisions between packages (two packages write the same key, reading a
  corrupted value) and makes the API impossible to inspect.
fix: >-
  Define a private type in the package that reads the value:
  `type ctxKey struct{}` (or `type ctxKey string` with a private constant), and
  export only accessor functions (`WithUser(ctx, u)`, `UserFrom(ctx)`)
  that encapsulate the key.
when_ok: >-
  Never an exported or string key for values carried by the context; if the
  value must be visible to other packages, expose an accessor function, not
  the key.
relationships:
  references:
    - https://go.dev/blog/context
    - https://pkg.go.dev/context
  uses: []
  validated_by: []
