id: pattern:antipattern:api-no-pagination
title: Collection without pagination or idempotency
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [http, rest, api, pagination, idempotency]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  `GET /items` returns everything in a single response (or an arbitrary
  undocumented limit), and creation POSTs have no idempotency (duplicates on
  retry).
detect: >-
  - List endpoints without pagination parameters (`page`/`cursor`/`limit`).
  - List response bodies without metadata (total, next).
  - POST without an idempotency key, duplicates observed on network retry.
problem: >-
  An unpaginated collection degenerates: huge responses, timeouts, useless
  load, impossible to consume at large volumes. Without idempotency, a retry
  (network, client) duplicates business effects (payment, creation).
fix: >-
  Cursor pagination (recommended for volatile data) or page/limit with
  metadata (`next`, `total`). For writes: `Idempotency-Key` (or POST with a
  client identifier) and store the associated response for retries. Always
  document the limits and defaults.
when_ok: >-
  An internal collection bounded by construction (< a few hundred) may stay
  unpaginated; pagination and idempotency are mandatory as soon as an external
  client or sensitive writes exist.
relationships:
  references:
    - https://datatracker.ietf.org/doc/draft-ietf-httpapi-idempotency-key-header/
    - https://github.com/microsoft/api-guidelines
    - https://www.infoq.com/articles/rest-anti-patterns
  uses: []
  validated_by: []
