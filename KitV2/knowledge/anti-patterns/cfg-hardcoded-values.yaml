id: pattern:antipattern:cfg-hardcoded-values
title: Configuration values hardcoded in the code
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [configuration, deployment, twelve-factor, design]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  Production URLs, ports, timeouts, feature flags and literal environment
  parameters in the source code, modifiable only by recompilation.
detect: >-
  - Constants/environment values mixed with the code (grep of URLs, ports).
  - Deployment to another environment requiring a distinct build (config
    embedded in the artifact).
  - "It works in dev, not in prod" — the config differs without control.
problem: >-
  Hardcoded values violate configuration externalization (CWE-15,
  Twelve-Factor): change = redeployment, environments confused, secrets
  exposed (see sec-hardcoded-credentials) and risk of configuration drift
  between environments.
fix: >-
  Read configuration from the environment or a config file injected at
  deployment, with safe defaults and validation at startup (fail fast). See
  the kit's recipe-config-viper and recipe-config-koanf for typed management.
  Same artifact deployed everywhere, values at runtime.
when_ok: >-
  A truly immutable code constant (protocol limit, fixed business value) may
  stay in code; the rule concerns values that vary by environment.
relationships:
  references:
    - https://cwe.mitre.org/data/definitions/15.html
    - https://12factor.net/config
  uses: []
  validated_by: []
