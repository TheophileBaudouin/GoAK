id: pattern:antipattern:go-loop-variable-capture
title: Loop variable capture in a goroutine
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, concurrency, loop, race, closure]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  A goroutine (or deferred closure) launched in a `for` loop uses the loop
  variable directly: `for i := range items { go func() {
  fmt.Println(i) }() }`.
detect: >-
  - `go func() { ... }()` in a loop using the iterated variable.
  - `go test -race` detects the race (pre-1.22); review of loop closures.
  - Since Go 1.22 the loop variable is re-initialized per iteration — the
    rule concerns code targeting earlier toolchains or portability.
problem: >-
  Before Go 1.22, all iterations share the same variable: goroutines read the
  final value or a concurrent value — duplicated outputs, wrong data, data
  race.
fix: >-
  On a toolchain < 1.22: `i := i` at the top of the loop or pass the value as
  an argument (`go func(i int) { ... }(i)`). On Go 1.22+: behavior fixed per
  iteration, but stay explicit when the loop captures other mutated variables
  (same rule as before).
when_ok: >-
  On Go 1.22+ simple capture is safe; vigilance remains required for variables
  declared outside the loop and mutated in the iteration.
relationships:
  references:
    - https://go.dev/wiki/CodeReviewConcurrency
    - https://100go.co/
  uses: []
  validated_by: []
