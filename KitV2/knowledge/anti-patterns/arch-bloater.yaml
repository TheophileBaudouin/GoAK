id: pattern:antipattern:arch-bloater
title: Bloater — overlong method/function, bloated data
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [architecture, code-smell, maintainability, refactoring]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  Functions of several hundred lines with multiple levels of condition,
  structs with many fields never used together, and duplicated blocks between
  functions.
detect: >-
  - High cyclomatic complexity per function (analysis tool, lint) — the
    pi-lens/complexity thresholds flag it.
  - Functions that require long scrolling to be understood.
  - Struct fields never read (dead code); detectable duplication (jscpd).
problem: >-
  "Bloaters" are the breeding ground of bugs: a long function makes error
  paths hard to audit, bloated data creates impossible states (incoherent
  field combinations), duplication makes fixes diverge. The refactoring
  catalog (Fowler) treats these smells by extraction.
fix: >-
  Extract blocks into named functions (extract method), group related fields
  into dedicated types, factor the duplication into a single point. The kit
  rule: a small explicit function over a large general one — the refactoring
  is mechanical and testable (see rules/testing).
when_ok: >-
  A long function without branches (linear data-processing sequence) may stay
  readable; the main signal is conditional complexity, not raw length.
relationships:
  references:
    - https://refactoring.guru/refactoring/smells
    - https://refactoring.com/catalog/
  uses: []
  validated_by: []
