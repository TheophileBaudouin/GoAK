id: pattern:antipattern:go-interface-everywhere
title: Interface for every dependency (over-abstraction)
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, interfaces, design, abstraction, testing]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  Every dependency has an interface defined before its single implementation:
  repository/factory/service layers that only relay to one concrete
  implementation.
detect: >-
  - Interface with a single implementation in the same package.
  - Understanding a flow requires traversing 4-5 files that call each other
    without adding behavior.
  - `grep -c interface` abnormally high for the project size.
problem: >-
  The interface adds indirection without benefit: costly navigation, more
  complex tests, and a larger API surface to maintain. The Go wiki recommends
  defining an interface where it is consumed, when an abstraction is really
  needed — not by default.
fix: >-
  Return concrete types; define an interface on the consumer side (small,
  with the methods actually used) only when a mock or a second implementation
  is justified. Let the compiler check conformance (`var _ Interface =
  (*Concrete)(nil)`). Prefer injecting concrete dependencies and functions.
when_ok: >-
  An interface is justified to decouple a consumer package from an unstable
  implementation (I/O, network, clock) or when multiple implementations
  really exist. Kit philosophy: `rules/core/philosophy`.
relationships:
  references:
    - https://100go.co/
    - https://go.dev/wiki/CodeReviewComments
  uses: []
  validated_by: []
