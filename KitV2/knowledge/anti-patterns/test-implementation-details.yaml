id: pattern:antipattern:test-implementation-details
title: Testing the implementation, not the behavior
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [testing, behavior, refactoring, mocking]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  Tests that check how the code does things (number of calls to an internal
  function, call order, private intermediate values) rather than what it
  produces.
detect: >-
  - Tests accessing unexported fields/methods via the same package or
    counting internal calls.
  - An internal refactor (function merging, structure change) breaking tests
    with no output change.
  - Mocks of trivial functions (e.g. a wrapper around `strings.ToUpper`).
problem: >-
  Implementation tests freeze details that must remain free to change: they
  turn every refactor into test work, inflate maintenance, and do not protect
  the real contract — the behavior observable from the outside.
fix: >-
  Test by behavior: public inputs → public outputs (see recipe-cli-interactive:
  test the `handleKey(string)` seam, not the framework). For dependencies,
  use small consumer interfaces or data fakes, not internal call counters.
  An internal refactor must not touch the tests.
when_ok: >-
  An assertion on an internal detail is justified to document behavior not
  otherwise observable (e.g. resource close order) — rare and to be
  commented.
relationships:
  references:
    - http://xunitpatterns.com/TestSmells.html
    - https://testsmells.org/
  uses: []
  validated_by: []
