id: pattern:antipattern:test-sleep-based
title: Tests based on real time (sleep)
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [testing, time, flakiness, concurrency]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  `time.Sleep(100 * time.Millisecond)` before an assertion (waiting for a
  goroutine, an event, a timeout) and race conditions tolerated as "it
  usually works".
detect: >-
  - `time.Sleep` in tests (grep).
  - Intermittent tests on a loaded CI (flaky by timing).
  - Assertions without explicit synchronization (waiting on a channel, a
    signal).
problem: >-
  A sleep is an arbitrary delay: too short → flaky, too long → slow suite; it
  provides no synchronization guarantee. Time-based concurrency tests mask
  races instead of revealing them — `go test -race` is not enough if the
  assertion waits for nothing.
fix: >-
  Synchronize by event: wait for reception on a channel, a `sync.WaitGroup`,
  a bounded poll with deadline (retry with short timeout and interval), or
  test the time seam (inject the clock). For time-based code, use a fake
  clock (pass `time.Now`/timer as a dependency) or `testing/synctest`
  (Go 1.25+) for time-bound goroutines.
when_ok: >-
  A bounded sleep while waiting for an external system (database, network)
  may stay in an integration test — always with a global deadline and never
  in a unit test.
relationships:
  references:
    - http://xunitpatterns.com/Slow%20Tests.html
    - https://go.dev/doc/go1.25
  uses: []
  validated_by: []
