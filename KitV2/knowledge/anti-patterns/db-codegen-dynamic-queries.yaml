---
id: pattern:antipattern:db-codegen-dynamic-queries
title: Dynamic queries forced onto a static code generator
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [database, sqlc, codegen, dynamic-queries, sql-injection]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  List or multi-criteria search endpoints (optional WHERE/ORDER BY)
  implemented by fighting sqlc: SQL fragments passed as parameters, unreadable
  CASE conditions to cover the combinations, or N generated queries for N
  filter combinations.
detect: >-
  - Search for dynamic fragments in .sql files (`@orderBy`, `@filter`,
    conditional concatenation of clauses).
  - `sqlc.embed()` on LEFT JOIN with NULL columns → scan crash or missing
    values (issue #2348; use `sqlc.nembed()` when available).
  - List endpoints that generate one query per filter combination instead of a
    parameterized construction.
problem: >-
  sqlc only generates STATIC queries: dynamic WHERE/ORDER BY are explicitly
  out of scope (issues #3414, #2061, discussion #364). Forcing dynamic
  behavior produces fragile, unreadable code — or worse, an unparameterized
  interpolation of SQL fragments that opens injection. It is the first
  adoption friction point of sqlc (top issues by reactions).
fix: >-
  Partition data access: keep sqlc for static, typed queries; for dynamic
  filters, use database/sql + a query builder (squirrel) or sqlx that builds
  the parameterized clause. Bound the combinations when possible (a finite set
  of known queries). Verify the nullability of embeds on JOIN (prefer
  `sqlc.nembed()` for LEFT JOIN).
when_ok: >-
  A bounded, known number of filter combinations can stay in sqlc via optional
  parameters (COALESCE / `$1 IS NULL OR`) if the execution plan and the index
  remain correct — to be validated with an execution plan, not for
  convenience.
relationships:
  references:
