---
id: pattern:antipattern:db-codegen-dynamic-queries
title: Requêtes dynamiques imposées à un générateur de code statique
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [database, sqlc, codegen, dynamic-queries, sql-injection]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  Endpoints de liste ou de recherche multi-critères (WHERE/ORDER BY
  optionnels) implémentés en luttant contre sqlc : fragments SQL passés en
  paramètres, conditions CASE illisibles pour couvrir les combinaisons, ou N
  requêtes générées pour N combinaisons de filtres.
detect: >-
  - Recherche de fragments dynamiques dans les fichiers .sql (`@orderBy`,
    `@filter`, concaténation conditionnelle de clauses).
  - `sqlc.embed()` sur des LEFT JOIN avec colonnes NULL → crash de scan ou
    valeurs absentes (issue #2348 ; `sqlc.nembed()` quand disponible).
  - Endpoints de liste qui génèrent une requête par combinaison de filtres au
    lieu d'une construction paramétrée.
problem: >-
  sqlc ne génère que des requêtes STATIQUES : les WHERE/ORDER BY dynamiques
  sont explicitement hors périmètre (issues #3414, #2061, discussion #364).
  Forcer le dynamique produit du code fragile et illisible, ou — pire — une
  interpolation de fragments SQL non paramétrée qui ouvre une injection.
  C'est le premier point de friction d'adoption de sqlc (top issues par
  réactions).
fix: >-
  Partitionner l'accès aux données : garder sqlc pour les requêtes
  statiques et typées ; pour les filtres dynamiques, utiliser database/sql +
  un query builder (squirrel) ou sqlx qui construit la clause paramétrée.
  Borner les combinaisons quand c'est possible (un nombre fini de requêtes
  connues). Vérifier la nullabilité des embeds sur JOIN (préférer
  `sqlc.nembed()` pour les LEFT JOIN).
when_ok: >-
  Un nombre borné et connu de combinaisons de filtres peut rester en sqlc via
  des paramètres optionnels (COALESCE / `$1 IS NULL OR`) si le plan
  d'exécution et l'index restent corrects — à valider par plan d'exécution,
  pas par commodité.
relationships:
  references:
    - https://github.com/sqlc-dev/sqlc/issues/3414
