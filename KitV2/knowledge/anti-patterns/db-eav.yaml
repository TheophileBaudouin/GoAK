id: pattern:antipattern:db-eav
title: Entité-Attribut-Valeur (EAV) pour des données structurées
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [database, schema, modeling, performance]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  Tables génériques `(entity_id, attribute, value)` pour stocker des attributs
  qui sont en réalité fixes et typés (propriétés de produits, champs de
  profil), souvent pour « éviter de changer le schéma ».
detect: >-
  - Schéma avec peu de tables et beaucoup de lignes attribut/value.
  - Requêtes qui pivotent (GROUP BY + MAX(CASE…)) pour reconstruire une ligne.
  - Type de valeur unique (TEXT) pour des données hétérogènes.
problem: >-
  EAV sacrifie les garanties du schéma : pas de type, pas de contrainte NOT
  NULL/CHECK, pas d'index naturel, JOINs et pivots coûteux, intégrité gérée en
  application. La complexité déplacée du schéma vers chaque requête.
fix: >-
  Colonnes dédiées typées pour les attributs fixes (`price NUMERIC NOT NULL`),
  et une table liée pour les attributs réellement dynamiques (paires clé/valeur
  limitées et validées). Si le besoin est un schéma flexible et versionné,
  évaluer une colonne JSONB + validation applicative au lieu d'EAV.
when_ok: >-
  EAV se justifie pour des attributs extensibles par l'utilisateur final non
  connus à l'avance (formulaires dynamiques) ; la payer par des index
  partiels et des vues matérialisées si besoin.
relationships:
  references:
    - https://sonra.io/mastering-sql-how-to-detect-and-avoid-34-common-sql-antipatterns/
  uses: []
  validated_by: []
