id: pattern:antipattern:db-eav
title: Entity-Attribute-Value (EAV) for structured data
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [database, schema, modeling, performance]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  Generic tables `(entity_id, attribute, value)` used to store attributes that
  are in fact fixed and typed (product properties, profile fields), often to
  "avoid changing the schema".
detect: >-
  - Schema with few tables and many attribute/value rows.
  - Queries that pivot (GROUP BY + MAX(CASE…)) to rebuild a row.
  - A single value type (TEXT) for heterogeneous data.
problem: >-
  EAV sacrifices schema guarantees: no type, no NOT NULL/CHECK constraint, no
  natural index, costly JOINs and pivots, integrity managed in the
  application. The complexity moves from the schema into every query.
fix: >-
  Dedicated typed columns for fixed attributes (`price NUMERIC NOT NULL`), and
  a linked table for truly dynamic attributes (bounded, validated key/value
  pairs). If the need is a flexible, versioned schema, evaluate a JSONB column
  + application-level validation instead of EAV.
when_ok: >-
  EAV is justified for attributes extensible by the end user and unknown in
  advance (dynamic forms); pay for it with partial indexes and materialized
  views if needed.
relationships:
  references:
    - https://sonra.io/mastering-sql-how-to-detect-and-avoid-34-common-sql-antipatterns/
