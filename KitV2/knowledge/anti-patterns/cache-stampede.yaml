id: pattern:antipattern:cache-stampede
title: Cache stampede — collapse of simultaneous accesses
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [caching, performance, availability, redis]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  When a popular entry expires, all simultaneous requests miss the cache and
  hit the source (database, API) at the same time: load spike, latency,
  possibly a source outage.
detect: >-
  - Synchronized TTLs (all entries expire at the same time) or popular entries
    with a uniform TTL.
  - Request spike toward the source at expiration time (metrics).
  - Cascade failure: empty cache (global expiration) → saturated source →
    cache still empty.
problem: >-
  The stampede (dog-piling) turns a banal expiration into an outage: the
  source receives n times the normal load at the worst moment. Without
  protection, the collapse repeats at every expiration cycle.
fix: >-
  TTL jitter (desynchronized expirations), per-key locking (single-flight:
  one request recomputes, the others wait), stale-while-revalidate (serve the
  stale value during recomputation), or planned preloading of hot entries. In
  Go: `singleflight.Group` or a per-key mutex.
when_ok: >-
  A cache with low concurrency per key (few simultaneous readers) can live
  without protection; the stampede becomes critical as soon as the load per
  key is high.
relationships:
  references:
    - https://en.wikipedia.org/wiki/Cache_stampede
    - https://redis.io/blog/cache-consistency-strategies/
  uses: []
  validated_by: []
