id: pattern:antipattern:msg-poison-pill-no-dlq
title: Poison pill without a dead-letter queue (DLQ)
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [messaging, kafka, consumer, resilience, dlq]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  A message that always fails to be consumed (deserialization, validation,
  logic) is retried indefinitely or blocks the partition: the consumer
  loops on error and lag accumulates.
detect: >-
  - Consumer in infinite retry on a partition (constant lag + repeated errors).
  - No destination for unprocessable messages (no DLQ/failure topic).
  - Deserialization errors treated as transient errors.
problem: >-
  A poison pill halts the progress of the whole partition: the following
  (valid) messages are never processed, endless retries waste CPU, and
  processing order is lost. Automatic retry does not fix a structurally
  invalid message.
fix: >-
  Separate the errors: transient → bounded retry with backoff; permanent
  (validation, deserialization) → immediate routing to a DLQ (dead letter
  topic) with cause metadata. Consume the DLQ regularly (repair, replay,
  alert). Define the retry/DLQ boundary clearly.
when_ok: >-
  A system without a DLQ can exist if every message is guaranteed processable
  (strict upstream contract); the absence of a DLQ must be a decision, not an
  oversight.
relationships:
  references:
    - https://www.confluent.io/blog/spring-kafka-can-your-kafka-consumers-handle-a-poison-pill/
    - https://www.conduktor.io/blog/dead-letter-topics-handling-poison-pills
  uses: []
  validated_by: []
