id: pattern:antipattern:go-goroutine-leak
title: Goroutine leak — goroutine launched without a guaranteed exit path
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, concurrency, goroutine, cancellation, memory]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  `go f()` is launched on a path where nothing guarantees that f terminates:
  permanent blocking on a channel receive, a `for` loop without an exit
  condition,
  a worker without a shutdown mechanism.
detect: >-
  - `runtime.NumGoroutine()` that grows under load or in a test loop.
  - Goroutine profile (`go tool pprof` → `goroutine`), stack trace showing
    channel receives without a sender.
  - Review: look for `go ` followed by a call without a context or end
  channel, and
    pipelines where a stage is never closed.
problem: >-
  Each leak consumes a stack and its references; leaks accumulate silently
  until OOM. It is a permissive bug: no runtime warning, it only reveals
  itself in production.
fix: >-
  Give every goroutine an explicit exit condition: pass a `context.Context`
  and `select` on `ctx.Done()`, close the channels consumers range over
  (`for range`), use `errgroup.WithContext` and `defer cancel()`. The official
  pipeline: each stage closes its output channel, cancellation propagation
  happens through the context.
when_ok: >-
  A long-lived goroutine is acceptable if it is deliberate (a server accept
  loop, daemon worker) and has a shutdown mechanism; the rule is "explicit
  exit condition", not "no persistent goroutine". Kit concurrency rules:
  `rules/core/concurrency`.
relationships:
  references:
    - https://go.dev/blog/pipelines
    - https://100go.co/
  uses: []
  validated_by: []
