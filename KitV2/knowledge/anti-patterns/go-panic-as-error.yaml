id: pattern:antipattern:go-panic-as-error
title: Panic/recover used as a general try/catch
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, errors, panic, recover, correctness]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  `panic(err)` in expected error paths (invalid input, I/O failure, API
  response) and a generic `recover()` at the top of the stack to catch
  everything.
detect: >-
  - `panic(` in code other than program invariants.
  - `defer func() { recover() }()` without handling a specific panic value.
  - The official doc: panic = program error (index out of range, impossible
    state), not an expected runtime error.
problem: >-
  An uncaught panic kills the process (or the goroutine, for HTTP handlers);
  a generic recover masks real bugs and loses the value and the stack trace.
  Control-flow-based error handling is unreadable and breaks `errors.Is/As`.
fix: >-
  Return expected errors (`return err`) and handle them at the call site;
  reserve panic for invariants (defensive programming against corrupted
  state) and recover for a precise boundary (e.g. an HTTP middleware that
  converts a panic into a 500 and logs the stack).
when_ok: >-
  A recover at the server boundary (so the process does not go down) is
  acceptable if it logs the stack and possibly re-panics in debug mode; it
  does not replace error handling.
relationships:
  references:
    - https://go.dev/wiki/PanicAndRecover
    - https://go.dev/blog/defer-panic-and-recover
  uses: []
  validated_by: []
