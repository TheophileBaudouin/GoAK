id: pattern:antipattern:go-panic-as-error
title: Panic/recover utilisé comme try/catch général
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, errors, panic, recover, correctness]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  `panic(err)` dans les chemins d'erreur attendus (entrée invalide, échec I/O,
  réponse d'API) et un `recover()` générique en haut de pile pour tout attraper.
detect: >-
  - `panic(` dans du code autre que les invariants de programme.
  - `defer func() { recover() }()` sans gérer une valeur de panique spécifique.
  - La doc officielle : panic = erreur de programme (index hors bornes, état
    impossible), pas erreur d'exécution attendue.
problem: >-
  Un panic non rattrapé tue le process (ou le goroutine, pour les handlers HTTP)
  ; un recover générique masque des bugs réels et perd la valeur et la stack
  trace. La gestion par flot de contrôle est illisible et casse `errors.Is/As`.
fix: >-
  Retourner les erreurs attendues (`return err`) et les gérer au point
  d'appel ; réserver panic aux invariants (programmation défensive d'un état
  corrompu) et recover à une frontière précise (ex. un middleware HTTP qui
  convertit un panic en 500 et loggue la stack).
when_ok: >-
  Un recover à la frontière du serveur (ne pas faire tomber le process) est
  acceptable s'il loggue la stack et re-panic éventuellement en mode debug ;
  il ne remplace pas la gestion d'erreur.
relationships:
  references:
    - https://go.dev/wiki/PanicAndRecover
    - https://go.dev/blog/defer-panic-and-recover
  uses: []
  validated_by: []
