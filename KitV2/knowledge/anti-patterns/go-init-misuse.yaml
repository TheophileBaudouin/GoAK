id: pattern:antipattern:go-init-misuse
title: init() with side effects — implicit initialization
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, init, initialization, side-effects, testing]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  `init()` opens connections, loads files, configures globals, registers
  handlers, or does I/O — effects triggered by the mere import of the package.
detect: >-
  - Presence of `init()` outside the unavoidable registry cases (flags,
    profiling).
  - Importing a package only for its `init` (side-effect import), hard to spot
    in review.
  - Tests that fail depending on the package import order.
problem: >-
  `init` execution is implicit, unordered (import order, undefined between
  files of the same package) and not directly testable: initialization
  failures are impossible to simulate, hidden dependencies complicate tests,
  and global state (see go-mutable-global-state) is shared.
fix: >-
  Move initialization into explicit functions called from `main` or a
  `New(...)` constructor that returns the error. An initialization failure
  must be a returned and handled error, not an `init` `panic`. Reserve `init`
  for the unavoidable static registries (flags, `http.HandleFunc` of demo
  packages) and keep them I/O-free.
when_ok: >-
  An `init` without side effects (package variable declarations, purely
  in-memory registry registration) remains acceptable.
relationships:
  references:
    - https://100go.co/
    - https://go.dev/wiki/CodeReviewComments
  uses: []
  validated_by: []
