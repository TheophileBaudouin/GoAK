id: pattern:antipattern:sec-error-information-leak
title: Internal information leak through errors
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [security, errors, api, information-disclosure]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  Internal errors (SQL, stack traces, file paths, dependency versions) are
  returned as-is to the HTTP client or displayed to the user.
detect: >-
  - `http.Error(w, err.Error(), 500)` with underlying/stack errors.
  - Application logs containing sensitive data (secrets, PII) — see
    obs-excessive-logging.
  - API responses that change with the database's internal state
    (enumeration clue).
problem: >-
  Error messages reveal the internal structure (DB schema, stack, paths,
  versions) and ease targeted attacks; distinguishing raw/internal vs
  external errors is a documented security control (OWASP error handling,
  A05 security misconfiguration).
fix: >-
  Log the full error with a correlated identifier (request ID) server-side;
  return a generic message and a stable code to the client. Map expected
  business errors to structured responses (see rest-ignoring-http-semantics);
  never raw `err.Error()` to the outside.
when_ok: >-
  Development environments may expose details (debug mode); the rule applies
  to shared environments and production.
relationships:
  references:
    - https://owasp.org/www-community/Improper_Error_Handling
    - https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
  uses: []
  validated_by: []
