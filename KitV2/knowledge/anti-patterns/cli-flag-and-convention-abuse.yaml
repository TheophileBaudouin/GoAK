id: pattern:antipattern:cli-flag-and-convention-abuse
title: CLI qui abuse des flags et ignore les conventions
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [cli, flags, conventions, ux, cobra]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  Flags obligatoires alors qu'un « option » doit être optionnel, flags
  réutilisés pour des sens différents (ex. `-i` pour autre chose que
  interactive), valeurs positionnelles surchargées, sortie et code de sortie
  incohérents.
detect: >-
  - Help incomplet ou inexistant (`-h` ne documente pas l'usage).
  - Flags dont le nom contredit le comportement ou l'habitude commune.
  - Codes de sortie identiques (toujours 0 ou toujours 1) quelle que soit la
    cause de l'échec.
  - Scriptabilité cassée : sortie formatée pour l'humain sans mode
    stable/pipeline.
problem: >-
  Les conventions CLI ont 40 ans : les utilisateurs et scripts les attendent
  (help, `-h/--help`, `--version`, code de sortie 0/≠0, options sur stdin
  quand nécessaire). Les ignorer rend l'outil imprévisible, non scriptable et
  coûteux à adopter — le guide clig.dev documente ces attendus.
fix: >-
  Suivre clig.dev : help complet, options réellement optionnelles, aliases
  cohérents, codes de sortie signifiants (0 succès, 2 usage, ≠0 erreur),
  sortie stable pour les scripts (mode JSON ou `--quiet`), sous-commandes
  pour les actions (voir recipe-cli-cobra). Tester le help et les codes de
  sortie.
when_ok: >-
  Un script jetable interne peut tolérer des raccourcis ; toute CLI
  distribuée ou utilisée en CI doit suivre les conventions.
relationships:
  references:
    - https://clig.dev/
    - https://jmmv.dev/2013/08/cli-design-putting-flags-to-good-use.html
  uses: []
  validated_by: []
