id: pattern:antipattern:cli-flag-and-convention-abuse
title: CLI that abuses flags and ignores conventions
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [cli, flags, conventions, ux, cobra]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  Mandatory flags while an "option" should be optional, flags reused with
  different meanings (e.g. `-i` for something other than interactive),
  overloaded positional values, inconsistent output and exit codes.
detect: >-
  - Incomplete or missing help (`-h` does not document usage).
  - Flags whose name contradicts the behavior or common practice.
  - Identical exit codes (always 0 or always 1) whatever the cause of the
    failure.
  - Broken scriptability: output formatted for humans without a
    stable/pipeline mode.
problem: >-
  CLI conventions are 40 years old: users and scripts expect them (help,
  `-h/--help`, `--version`, exit code 0/≠0, options on stdin when needed).
  Ignoring them makes the tool unpredictable, non-scriptable, and costly to
  adopt — the clig.dev guide documents these expectations.
fix: >-
  Follow clig.dev: complete help, truly optional options, coherent aliases,
  meaningful exit codes (0 success, 2 usage, ≠0 error), stable output for
  scripts (JSON mode or `--quiet`), subcommands for actions (see
  recipe-cli-cobra). Test the help and the exit codes.
when_ok: >-
  A disposable internal script may tolerate shortcuts; any distributed CLI or
  one used in CI must follow the conventions.
relationships:
  references:
    - https://clig.dev/
    - https://jmmv.dev/2013/08/cli-design-putting-flags-to-good-use.html
  uses: []
  validated_by: []
