id: pattern:antipattern:arch-distributed-monolith
title: Distributed monolith — services coupled at runtime
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [architecture, microservices, coupling, latency]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  Services deployed separately but coupled at runtime: deep synchronous call
  chains, shared database, contracts that change together, distributed
  transaction.
detect: >-
  - Synchronous call chains A→B→C→D for a single user request.
  - A schema change in one service forces an immediate change in another
    (implicit contract).
  - Latency that adds up along the chain; cascade degradation.
problem: >-
  The distributed monolith combines the costs of a distributed system
  (latency, partial failures, deployments) with the drawbacks of a monolith
  (coupling, coordinated changes) — the worst of both worlds. It is the most
  frequent failure of microservices migrations.
fix: >-
  Strengthen boundaries: explicit, versioned contracts, data owned by a
  single service (no shared database — see arch-shared-database), asynchronous
  communication (events) for non-transactional flows, and fault tolerance
  (timeouts, bounded retry, circuit breaker — see msg-retry-storm). Only
  decompose real business boundaries.
when_ok: >-
  If the system is already deployed and evolves coherently, a modular
  monolith (strict package boundaries) is often the best option; decomposition
  is debt to be repaid with measurements.
relationships:
  references:
    - https://softwarepatternslexicon.com/microservices-boundaries-and-service-decomposition/anti-patterns/the-distributed-monolith/
    - https://dzone.com/articles/antipatterns-of-microservices
  uses: []
  validated_by: []
