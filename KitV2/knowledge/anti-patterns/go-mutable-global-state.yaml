id: pattern:antipattern:go-mutable-global-state
title: Mutable state at package level (global variables)
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, design, global-state, testing, race]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  Mutable package variables (`var db *sql.DB`, `var config map[string]any`)
  initialized in `init()` or on first use, read/written from several
  packages.
detect: >-
  - Non-constant package `var` outside types and sentinels.
  - Access to a package variable from several goroutines without
    synchronization (race).
  - Tests that interfere with each other (shared state not reset).
problem: >-
  Mutable globals create hidden dependencies: packages call each other
  implicitly, the initialization order (`init`) is opaque, tests are no
  longer isolated (non-determinism), and concurrency introduces races. It is
  the classic vector of "works in dev, not in prod" bugs.
fix: >-
  Injected dependency: build the dependencies (db, logger, config) in `main`
  or a `New(...)` function and pass them explicitly. For configuration
  values, a `Config` type built once and passed as a parameter. Keep globals
  only for immutable values and sentinels.
when_ok: >-
  Truly process-wide shared singletons (connection pool) may live in a package
  variable if they are built explicitly and not reassigned after startup —
  injection remains preferable for testability.
relationships:
  references:
    - https://dave.cheney.net/paste/going-without.pdf
    - https://100go.co/
  uses: []
  validated_by: []
