id: pattern:antipattern:db-n-plus-one
title: N+1 query — one query per item
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [database, sql, performance, queries]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  For each row of a result, an additional query is executed (loading children,
  references, counts): `for rows { SELECT ... WHERE parent_id = ... }`.
detect: >-
  - SQL profile: n+1 identical queries in sequence (SQL log,
    pg_stat_statements).
  - Loops containing a database call (review).
  - Latency that grows linearly with the size of the list.
problem: >-
  Each item costs a network round trip + execution plan: a list of 1000 items
  generates 1001 queries, seconds of latency and useless load on the database.
  It is the most cited SQL performance problem.
fix: >-
  A single query with `JOIN` or `IN (…)` (batched loading of children); in Go,
  build the IN clause in bounded batches, group the results into a map
  (`parentID → []child`) and assemble in memory. Verify with the slow-query
  tool that the number of queries stays constant.
when_ok: >-
  Acceptable for very small known volumes (a few items) or when the DBMS
  cannot JOIN (sharding); otherwise always batching.
relationships:
  references:
    - https://sonra.io/mastering-sql-how-to-detect-and-avoid-34-common-sql-antipatterns/
    - https://slicker.me/sql/antipatterns.htm
