id: pattern:antipattern:msg-retry-storm
title: Retry storm — aggressive retries without a limit or breaker
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [resilience, retry, circuit-breaker, timeouts, distributed]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  Every client retries immediately and without backoff when a service
  degrades; retries amplify across layers (A retries against B, B against C,
  C against D) and the failing service receives a deluge.
detect: >-
  - Retries without exponential delay or jitter, high attempt count.
  - Cascade: one service slowing down causes load to spike on its dependents
    (runaway effect).
  - No circuit breaker: retries keep hitting a service that is clearly
    failing.
problem: >-
  The Microsoft architecture center documents the retry storm as a major
  cause of outages: synchronized retries (all clients retrying at the same
  time) turn a limited failure into a general collapse. Without a breaker,
  failure propagates instead of isolating.
fix: >-
  Retries with exponential backoff + jitter, bounded (small attempt count)
  and limited to transient errors (timeout, 5xx, 429 with Retry-After
  respected). Add a circuit breaker per dependency (fail fast after an error
  threshold), strict upstream timeouts (see http-no-timeouts) and independent
  redundancy (bulkhead) to isolate layers.
when_ok: >-
  Retry is healthy on real transient errors with backoff; the anti-pattern is
  blind, immediate, uncapped retry on durable failures.
relationships:
  references:
    - https://github.com/microsoftdocs/architecture-center/blob/main/docs/antipatterns/retry-storm/index.md
    - https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/circuit-breaker.html
  uses: []
  validated_by: []
