id: pattern:antipattern:http-no-timeouts
title: HTTP server without timeouts (default values)
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [http, server, timeout, availability, net-http]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  `http.Server{Addr: ":8080"}` without `ReadTimeout`, `ReadHeaderTimeout`,
  `WriteTimeout`, `IdleTimeout` — or raw `http.ListenAndServe`.
detect: >-
  - `http.Server` struct with only Addr/Handler.
  - Handler review: long-running operations without `http.TimeoutHandler` or
    request-context handling.
problem: >-
  ServeMux defaults impose no timeouts: a slow client occupies a worker
  indefinitely, idle connections accumulate, and a blocked handler grows the
  queue — trivial denial of service (slowloris) and unavailability under
  load. The Cloudflare guide documents the distinction between server and
  handler timeouts.
fix: >-
  Configure all timeouts: `ReadHeaderTimeout` (5-10s), `ReadTimeout`
  (10-30s), `WriteTimeout` (30-60s), `IdleTimeout` (60-120s) according to the
  profile. For long-running operations, `http.TimeoutHandler` at the handler
  level and respect `r.Context()` ; `http.Server.Shutdown(ctx)` for graceful
  shutdown (see recipe-graceful-shutdown).
when_ok: >-
  Exact values depend on the product; the rule is to define them — no
  default value is acceptable in production.
relationships:
  references:
    - https://blog.cloudflare.com/the-complete-guide-to-golang-net-http-timeouts/
    - https://pkg.go.dev/net/http
  uses: []
  validated_by: []
