id: pattern:antipattern:test-brittle-tests
title: Brittle tests — failures on legitimate refactors
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [testing, maintainability, brittleness]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  Tests fail without a behavior change: map iteration order, message format,
  internal implementation, timing. The suite becomes "flaky" and its trust
  erodes.
detect: >-
  - Tests depending on map order or on the exact value of a non-contractual
    message.
  - Intermittent CI failures (rerunning passes).
  - Tests broken by a refactor that does not change the observed behavior
    (false alarm).
problem: >-
  A brittle test costs more than it brings: it blocks legitimate changes,
  teaches the team to ignore the suite (and therefore real regressions), and
  consumes team time. The test smells literature (xUnit Test Patterns) ranks
  brittleness among the worst test defects.
fix: >-
  Assert observable behavior, not implementation: sort map iterations,
  compare with structural equality matchers (`assert.ElementsMatch`), avoid
  timing assertions (see test-sleep-based), do not depend on error message
  format. A test should change only when the contract changes.
when_ok: >-
  A strict assertion is justified when the format is the contract (public
  API, snapshot); the rest of the time, the assertion should tolerate
  implementation details.
relationships:
  references:
    - http://xunitpatterns.com/TestSmells.html
    - https://testsmells.org/
  uses: []
  validated_by: []
