id: pattern:antipattern:test-brittle-tests
title: Tests fragiles — échecs sur refactor légitime
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [testing, maintainability, brittleness]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  Les tests échouent sans changement de comportement : ordre d'itération d'une
  map, format d'un message, implémentation interne, timing. La suite devient
  « flaky » et sa confiance s'érode.
detect: >-
  - Tests qui dépendent de l'ordre d'une map ou de la valeur exacte d'un
    message non contractuel.
  - Échecs intermittents en CI (relancer passe).
  - Tests cassés par un refactor qui ne change pas le comportement observé
    (fausse alerte).
problem: >-
  Un test fragile coûte plus qu'il ne rapporte : il bloque des changements
  légitimes, enseigne à ignorer la suite (et donc les vraies régressions) et
  consomme du temps d'équipe. La littérature des test smells (xUnit Test
  Patterns) classe la fragilité parmi les pires défauts de tests.
fix: >-
  Asserter le comportement observable, pas l'implémentation : trier les
  itérations de map, comparer via des égaliteurs structurels
  (`assert.ElementsMatch`),
  éviter les assertions de timing (voir test-sleep-based), ne pas dépendre du
  format des messages d'erreur. Un test doit changer seulement quand le
  contrat change.
when_ok: >-
  Une assertion stricte se justifie quand le format est le contrat (API
  publique, snapshot) ; le reste du temps, l'assertion doit tolérer les
  détails d'implémentation.
relationships:
  references:
    - http://xunitpatterns.com/TestSmells.html
    - https://testsmells.org/
  uses: []
  validated_by: []
