id: pattern:antipattern:sec-hardcoded-credentials
title: Hardcoded secrets (passwords, keys, tokens)
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [security, secrets, credentials, configuration]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  Passwords, API keys, tokens, and connection strings in plaintext in the
  source code, versioned config files, or command-line arguments.
detect: >-
  - Secret scanning (gitleaks, gosec G101, trufflehog) — the kit gate runs
    them.
  - `grep -r` for key/token patterns in the repository.
  - Git history: a committed secret stays recoverable even after deletion
    (rotation required).
problem: >-
  A secret in code is exposed to anyone who reads the repository (internal,
  fork, CI logs, artifacts); CWE-15 classifies configuration externalization
  as a security control. Once leaked, the only response is secret rotation —
  costly and often forgotten.
fix: >-
  Read secrets from the environment or a secrets manager (Vault, cloud secret
  manager) at startup; never commit them, never log them. Set up secret
  scanning in CI (gitleaks) and immediate rotation of any historically
  exposed secret.
when_ok: >-
  A throwaway local development secret may stay in a gitignored file; it must
  be distinct from production and absent from the repository.
relationships:
  references:
    - https://owasp.org/www-community/vulnerabilities/Use_of_hard-coded_password
    - https://cwe.mitre.org/data/definitions/798.html
  uses: []
  validated_by: []
