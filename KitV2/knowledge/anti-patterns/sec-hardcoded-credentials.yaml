id: pattern:antipattern:sec-hardcoded-credentials
title: Secrets codés en dur (mots de passe, clés, tokens)
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [security, secrets, credentials, configuration]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  Mots de passe, clés API, tokens et chaînes de connexion en clair dans le
  code source, les fichiers de config versionnés, ou les arguments de commande.
detect: >-
  - Scan de secrets (gitleaks, gosec G101, trufflehog) — la gate du kit les
    exécute.
  - `grep -r` sur des patterns de clés/tokens dans le dépôt.
  - Historique git : un secret committé reste récupérable même après
    suppression (rotation obligatoire).
problem: >-
  Un secret dans le code est exposé à quiconque lit le dépôt (interne, fork,
  CI logs, artefacts) ; CWE-15 classe l'externalisation de la configuration
  comme contrôle de sécurité. Une fois fuite, la seule réponse est la
  rotation du secret — coûteuse et souvent oubliée.
fix: >-
  Lire les secrets depuis l'environnement ou un gestionnaire de secrets
  (Vault, secret manager cloud) au démarrage ; ne jamais les committer, ne
  jamais les logger. Mettre en place un scan de secrets en CI (gitleaks) et
  la rotation immédiate de tout secret historiquement exposé.
when_ok: >-
  Un secret de développement local jetable peut rester dans un fichier
  gitignoré ; il doit être distinct de la production et absent du dépôt.
relationships:
  references:
    - https://owasp.org/www-community/vulnerabilities/Use_of_hard-coded_password
    - https://cwe.mitre.org/data/definitions/798.html
  uses: []
  validated_by: []
