id: pattern:antipattern:sec-no-threat-modeling
title: No threat model — "safe" design by intuition
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [security, threat-modeling, design, owasp]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  The architecture is validated on features without examining threats: no
  trust boundaries identified, no attacker assumptions, security added at the
  end of development "when there is time".
detect: >-
  - No mention of trust boundaries (untrusted inputs, boundaries between
    processes) in the design.
  - Post-hoc security controls (auth added after the data model, input
    validation after the handlers).
  - OWASP A06 2025 "Insecure Design": the problem is the design, not the
    implementation — scanners do not detect it.
problem: >-
  Design flaws (authorization by default, exposed objects, untrusted file
  handling) are not code bugs: scanners cannot detect them and they cost a
  rewrite once discovered. Without a threat model, security rests on
  intuition and forgetfulness.
fix: >-
  Build a lightweight threat model from design time: identify actors, trust
  boundaries, sensitive data, and realistic attack paths (simplified STRIDE),
  then translate each threat into a control requirement (input validation,
  authz, rate limiting). Revise the model on every architecture change.
when_ok: >-
  The level of rigor follows exposure: an internal service with non-sensitive
  data may have a minimal model; any exposed system or one handling at-risk
  data requires a documented model.
relationships:
  references:
    - https://owasp.org/Top10/2025/A06_2025-Insecure_Design/
  uses: []
  validated_by: []
