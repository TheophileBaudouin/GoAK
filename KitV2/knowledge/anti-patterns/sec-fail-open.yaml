id: pattern:antipattern:sec-fail-open
title: Fail open — security disabled by default or on error
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [security, authorization, error-handling, design]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  Security controls are conditional on an enable flag, authorization errors
  fail as 'access allowed', authentication is bypassed when the identity
  provider is unavailable.
detect: >-
  - `if authEnabled { … }` around the controls, default = disabled.
  - On verification error, the default path continues (deny is not explicit).
  - OWASP A10 2025 'Mishandling of Exceptional Conditions': error paths must
    fail closed.
problem: >-
  A fail-open turns an outage into a breach: the smallest error (IdP
  timeout, middleware bug, forgotten config) lets unauthenticated access
  through. Permissive defaults are the most dangerous error class because
  they stay silent until the incident.
fix: >-
  Fail closed: deny by default, allow explicitly; any verification error →
  reject (401/403) and log. Never gate a control on a flag that defaults to
  disabled. Explicitly test the control's error paths (IdP down, invalid
  token, timeout).
when_ok: >-
  An open 'degraded' mode is justified only with an explicit product decision
  and a documented accepted risk (e.g. public read) — never by accident.
relationships:
  references:
    - https://owasp.org/Top10/2025/A10_2025-Mishandling_of_Exceptional_Conditions/
    - https://owasp.org/Top10/2025/A06_2025-Insecure_Design/
  uses: []
  validated_by: []
