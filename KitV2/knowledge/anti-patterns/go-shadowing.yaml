id: pattern:antipattern:go-shadowing
title: Shadowing — variable masked by an inner declaration
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, correctness, scope, shadow, review]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  `err :=` (or `:=`) inside a block reuses a name already declared in an
  enclosing scope, masking the original: the outer scope value stays
  unchanged while the code seems to update it.
detect: >-
  - `shadow` analyzer (`go vet -vettool=$(which shadow)` or
    `golang.org/x/tools/go/analysis/passes/shadow`); golangci-lint (`govet`
    with the shadow check enabled).
  - Review: `:=` in `if`/`for`/`switch` reusing an outer name.
problem: >-
  Shadowing produces silent bugs: an assignment that "does not take", a
  masked `err` that does not propagate the error, a variable confusion that
  survives refactors. The compiler does not warn (legal in Go).
fix: >-
  Avoid reusing outer-scope names in nested blocks; prefer distinct names or
  restructure to deliberately assign the outer variable. Enable the shadow
  check in lint to make detection deterministic.
when_ok: >-
  Deliberate shadowing is sometimes used to restrict a scope (e.g. an `err`
  local to a block); it must then be explicit and commented, never
  accidental.
relationships:
  references:
    - https://100go.co/
    - https://pkg.go.dev/golang.org/x/tools/go/analysis/passes/shadow
  uses: []
  validated_by: []
