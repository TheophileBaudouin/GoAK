---
id: pattern:antipattern:sec-ssh-host-key-reuse
title: SSH host key shared across instances or regenerated at every boot
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [security, ssh, host-keys, mitm, infrastructure]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  The same SSH host key is embedded in every instance, container, or image
  (or committed to the repository); or it is regenerated at every startup;
  wish without `WithHostKeyPath` regenerates a default auto key on ephemeral
  hosts.
detect: >-
  - A private host key in version control or the Docker image.
  - Cloned/immutable instances with an identical host key (compare
    fingerprints in clients' known_hosts).
  - Key absent from persistent storage for a host whose clients pin the
    identity.
problem: >-
  A shared private key is "only as private as it is shared": compromising one
  instance allows impersonating all the others (undetectable MITM for clients
  that pinned this key). A key regenerated at every boot breaks pinning
  (TOFU) and opens the door to a fraudulent first contact; sshd also refuses
  key files accessible to group/world.
fix: >-
  One host key per host: generate at first install, persist with owner-only
  permissions (0600), and inject via secret management in ephemeral
  infrastructures (never in the image or repository). For wish, provide
  `WithHostKeyPath` pointing to the persisted key instead of the default
  auto-generation.
when_ok: >-
  Ephemeral hosts without clients that pin the identity may regenerate their
  key at every boot — explicitly document that identity continuity is not
  guaranteed.
relationships:
  references:
    - https://security.stackexchange.com/questions/41380/are-duplicate-ssh-server-host-keys-a-problem
    - https://github.com/charmbracelet/wish/blob/main/README.md
    - https://github.com/openssh/openssh-portable/blob/master/sshd_config.5
  uses: []
  validated_by: []
