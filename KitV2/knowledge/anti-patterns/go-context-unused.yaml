id: pattern:antipattern:go-context-unused
title: Ignored context or cancel never called
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [go, context, cancellation, timeout, correctness]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  A function receives a `ctx` but does not pass it to any blocking call (I/O,
  request, loop), or `context.WithCancel/WithTimeout` is called without
  `defer cancel()`.
detect: >-
  - `ctx context.Context` parameter present in the signature but absent from
    all internal blocking calls (linters: `contextcheck`, `containedctx`).
  - Call to `WithTimeout`/`WithCancel` without `defer cancel()` (golangci-lint:
    `contextcheck` does not cover all of them — manual review).
  - Tests that ignore `ctx` and cannot simulate a cancellation.
problem: >-
  An accepted but unused context is a correctness bug, not a style issue: the
  caller that cancels or imposes a deadline is silently ignored — the code
  keeps running until the end of the operation. A `cancel` never called leaks
  one goroutine per operation (see go-goroutine-leak).
fix: >-
  Pass `ctx` to every call that can block (net/http, database/sql, network
  requests). Call `cancel` immediately: `ctx, cancel :=
  context.WithTimeout(parent, d); defer cancel()`. Create a derived context
  only to add a value or a constraint; otherwise pass the parent as-is.
when_ok: >-
  A pure function or a guaranteed bounded operation (short local computation)
  may not use the context — but the convention still expects it to receive one
  for the composability of future calls. Kit concurrency rules:
  `rules/core/concurrency`.
relationships:
  references:
    - https://go.dev/blog/context
    - https://pkg.go.dev/context
  uses: []
  validated_by: []
