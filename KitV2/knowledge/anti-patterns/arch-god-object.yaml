id: pattern:antipattern:arch-god-object
title: God Object — central type that does everything
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [architecture, design, cohesion, coupling]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  A type (struct) accumulates dozens of unrelated methods: validation,
  persistence, computation, rendering, notification — referenced by almost the
  whole codebase.
detect: >-
  - A central type with a disproportionate number of methods (> ~20) and
    several responsibilities (method names from different domains).
  - High fan-in: this type appears in the signature of a large share of
    functions (module_report "hubs").
  - Tests that must build the whole object to test an isolated behavior.
problem: >-
  The god object violates cohesion: every modification touches a shared type,
  transitive dependencies multiply, unit testing becomes expensive (monster
  builder), and concurrency on the central state creates races.
fix: >-
  Split by responsibility into small types (or free functions) with minimal
  state: the HTTP handler does not manipulate the store, the domain does not
  know about rendering. Reduce fan-in via dependency injection of components
  (see go-mutable-global-state and go-interface-everywhere).
when_ok: >-
  A domain aggregate (DDD) with invariants and strong-cohesion methods is not
  a god object; the signal is the plurality of unrelated responsibilities, not
  size alone.
relationships:
  references:
    - https://refactoring.guru/smells/large-class
    - https://en.wikipedia.org/wiki/List_of_software_anti-patterns
  uses: []
  validated_by: []
