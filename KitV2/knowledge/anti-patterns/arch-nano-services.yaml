id: pattern:antipattern:arch-nano-services
title: Nano-services — decomposition too fine-grained
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [architecture, microservices, deployment, overhead]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  Tiny services (one handler, one table) deployed separately: "every endpoint
  is a microservice", dozens of repositories for a small team.
detect: >-
  - Services with a single atomic responsibility but shared dependencies to
    other services (constant inter-service calls).
  - Operation cost (deployment, observability, CI) higher than the code cost
    of each service.
  - Almost all requests traverse several services (see
    arch-distributed-monolith).
problem: >-
  Fine-grained decomposition multiplies failure points, inter-service latency,
  and operation cost without bringing a business boundary: overall
  maintainability degrades while each unit is "clean". It is the inverse
  over-correction of the monolith.
fix: >-
  Decompose by coherent business boundary (aggregates, independent lifecycles)
  rather than by technical function. Group operations that share data and
  invariants into the same service. Measure: a service is justified if it has
  its own lifecycle, team, or scale.
when_ok: >-
  A small size is acceptable if the boundaries are real and data is not
  shared; the error signal is permanent inter-service conversation, not size
  in lines.
relationships:
  references:
    - https://dzone.com/articles/antipatterns-of-microservices
    - https://algomaster.io/learn/microservices/anti-patterns-reference
