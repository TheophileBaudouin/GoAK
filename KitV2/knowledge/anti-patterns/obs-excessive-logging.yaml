id: pattern:antipattern:obs-excessive-logging
title: Logging excessif — bruit sans signal
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [observability, logging, performance, noise]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  Chaque opération loggue plusieurs lignes (début/fin/chaque étape), des logs
  en boucle chaude (par requête, par message), des valeurs à haute
  cardinalité (IDs non agrégés, corps entiers) et des messages cryptiques sans
  contexte.
detect: >-
  - Volume de logs démesuré par rapport au trafic ; coût de stockage qui
    domine.
  - Logs en boucle (débit élevé) sans agrégation — voir la discussion
    « too much logging breaks debugging ».
  - Impossibilité de retrouver un incident : le signal est noyé.
problem: >-
  Le bruit coûte cher (stockage, I/O, CPU) et dégrade le débogage : plus on
  loggue, moins on lit les logs. Les chemins chauds ralentissent sous
  charge, et les logs à haute cardinalité cassent les systèmes de collecte
  (indexation).
fix: >-
  Logger à des niveaux utiles : info pour les événements métier rares, debug
  pour le détail ; jamais par défaut en production. Éviter les logs en boucle
  (agréger avec des compteurs de métriques), limiter la cardinalité (pas de
  corps de requête ni d'IDs inutiles), et corréler par request ID. Une ligne
  de log doit permettre une action, pas documenter chaque étape.
when_ok: >-
  Le détail devient acceptable en mode debug ou lors d'un incident ciblé ;
  la règle concerne le niveau de production par défaut.
relationships:
  references:
    - https://observability-antipatterns.github.io/
    - https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
  uses: []
  validated_by: []
