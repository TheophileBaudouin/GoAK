id: pattern:antipattern:obs-excessive-logging
title: Excessive logging — noise without signal
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [observability, logging, performance, noise]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  Every operation logs several lines (start/end/each step), hot-loop logs
  (per request, per message), high-cardinality values (unaggregated IDs, full
  bodies) and cryptic messages without context.
detect: >-
  - Log volume disproportionate to traffic; storage cost dominates.
  - Loop logs (high rate) without aggregation — see the 'too much logging
    breaks debugging' discussion.
  - Incidents cannot be found: the signal is drowned.
problem: >-
  Noise is expensive (storage, I/O, CPU) and degrades debugging: the more you
  log, the less logs are read. Hot paths slow down under load, and
  high-cardinality logs break collection systems (indexing).
fix: >-
  Log at useful levels: info for rare business events, debug for detail;
  never by default in production. Avoid loop logs (aggregate with metric
  counters), limit cardinality (no request bodies or unnecessary IDs), and
  correlate by request ID. A log line must enable an action, not document
  every step.
when_ok: >-
  Detail becomes acceptable in debug mode or during a targeted incident; the
  rule concerns the default production level.
relationships:
  references:
    - https://observability-antipatterns.github.io/
    - https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
  uses: []
