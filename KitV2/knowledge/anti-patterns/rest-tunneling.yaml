id: pattern:antipattern:rest-tunneling
title: RPC tunnel — everything through GET or POST
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [http, rest, api, design]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  All operations go through `GET /api/action?op=delete` or `POST /api/do`
  with a JSON 'action' envelope; HTTP verbs and status codes carry no
  information.
detect: >-
  - Generic endpoints (`/api`, `/execute`) with action names in a parameter
    or the body.
  - Responses always 200 with a `success`/`error` field in the body.
  - Non-idempotent operations exposed via GET (breaks caching, clients,
    crawlers).
problem: >-
  Reinventing RPC over HTTP loses the protocol's guarantees: caching,
  idempotency, standard statuses, discovery. Clients can infer nothing, the
  API is opaque, and destructive GETs cause accidents.
fix: >-
  Expose resources with HTTP verbs: GET (read, idempotent), POST
  (non-idempotent creation/action), PUT (replacement), PATCH (partial
  update), DELETE; use standard status codes and headers. See
  recipe-rest-chi for a conforming base.
when_ok: >-
  REST action endpoints (POST /orders/{id}/cancel) are legitimate when the
  action is not plain CRUD on a resource; the tunnel is the abuse, not the
  action endpoint.
relationships:
  references:
    - https://www.infoq.com/articles/rest-anti-patterns
    - https://www.innoq.com/blog/st/2008/07/rest-anti-patterns/
  uses: []
  validated_by: []
