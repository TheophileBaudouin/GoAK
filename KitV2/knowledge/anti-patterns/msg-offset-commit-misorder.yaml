id: pattern:antipattern:msg-offset-commit-misorder
title: Consumer offset commit misordering
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [messaging, kafka, consumer, offset, data-loss]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  Offsets committed before processing (data loss if a crash follows),
  auto-commit enabled with manual processing, or commit after unordered
  asynchronous processing (committing an older message regresses the offset).
detect: >-
  - `enable.auto.commit=true` while the processing logic is
    manual/asynchronous.
  - Commit immediately after reception, before processing and its persistence.
  - Concurrent processing by partitions/ranks without commit-order guarantee
    (a position that moves backward).
problem: >-
  Commit too early = message loss on failure; commit too late or out of order
  = reprocessing and duplicates. Both modes corrupt stream accuracy
  (at-most-once vs uncontrolled at-least-once).
fix: >-
  Choose the semantics explicitly: at-least-once → process then commit
  (commit after persistence, checking the error), disabling auto-commit when
  processing is not synchronous. For concurrent processing, commit in order
  (track the oldest rank's position) and handle rebalance (see rebalance
  listener). Idempotent processing absorbs duplicates.
when_ok: >-
  At-most-once (commit before processing) may suit telemetry streams where
  loss is accepted; it is a documented product choice, not an accident.
relationships:
  references:
    - https://docs.confluent.io/platform/current/clients/consumer.html
    - https://www.confluent.io/blog/spring-kafka-can-your-kafka-consumers-handle-a-poison-pill/
  uses: []
  validated_by: []
