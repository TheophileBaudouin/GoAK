id: pattern:antipattern:obs-logging-not-observability
title: Logging mistaken for observability
kind: Pattern
version: 1
status: active
owner: go-agent-kit
tags: [observability, logging, metrics, tracing, debugging]
go_version: "1.22+"
dependencies: []
last_verified: 2026-08-04
symptom: >-
  Logs exist (sometimes massive) but a production question ('why is this
  request slow?', 'which message queue is behind?') remains unanswered
  without additional instrumentation.
detect: >-
  - Incident debugged by adding logs then redeploying (loop).
  - No correlation (request ID) between signals; no latency/throughput
    metrics, no traces.
  - 'Dashboard as a security blanket': dashboards exist but do not tell the
    incident story.
problem: >-
  Logging alone is passive: it records what you thought to log before the
  incident, with no structure to answer new questions. Observability links
  logs, metrics and traces (correlation) to reconstruct the behavior of a
  distributed system.
fix: >-
  Instrument the three signals: RED/USE metrics on endpoints and queues,
  distributed traces with context (opentelemetry — see
  source:go:opentelemetry), correlated structured logs (request/span ID).
  Formulate the expected operational questions and verify that a dashboard
  answers them before the incident.
when_ok: >-
  A short internal script or tool can live without full observability; any
  shared or distributed service needs it from the first production
  deployment.
relationships:
  references:
    - https://observability-antipatterns.github.io/
    - https://opentelemetry.io/docs/languages/go/
  uses: []
  validated_by: []
