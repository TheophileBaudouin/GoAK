selection: >-
  Consider a high-level HTTP client only when built-in retries, middleware,
  backoff, and multipart features are explicitly required; the kit's canonical
  client remains stdlib net/http. Resty is instance-oriented, so build and
  reuse an explicit *resty.Client rather than relying on package-global
  configuration.
limits:
  - >-
    This pointer is not a product recommendation and has no runnable recipe;
    verify the current release and net/http compatibility before adoption.
  - >-
    The kit's extract-only catalog for high-level HTTP client patterns is
    imroc/req; evaluate Resty against it and against net/http before choosing,
    and keep client configuration explicit and shared.
relationships:
  references:
    - https://github.com/go-resty/resty
    - https://github.com/imroc/req
