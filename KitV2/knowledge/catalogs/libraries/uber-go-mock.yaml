selection: >-
  Consider when interface-contract mocking is explicitly required; the kit's
  testing rules remain stdlib-first with testify for assertions, and mocks are
  only justified for verified interface boundaries.
limits:
  - >-
    This pointer is not a product recommendation and has no runnable recipe;
    prefer hand-written fakes over generated mocks unless the interface surface
    is genuinely large and stable.
  - >-
    Generated mock code must be regenerated and reviewed whenever the mocked
    interface changes; validate the current release before adoption.
