selection: >-
  Consider as a thin extension of database/sql when scanning into structs,
  named parameters, or in-clause helpers are needed without adopting an ORM.
  The sqlc catalog already points to database/sql plus a query builder as the
  fallback for dynamic queries; sqlx fits that same explicit-SQL posture.
limits:
  - >-
    This pointer is not a product recommendation and has no runnable recipe;
    verify the current release and driver compatibility before adoption.
  - >-
    sqlx still wraps database/sql, so pool, transaction, and context semantics
    are governed by the underlying driver and stdlib behavior.
