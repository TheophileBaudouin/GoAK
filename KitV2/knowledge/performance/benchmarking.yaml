limits: >-
  A benchmark measures the machine and compiler version it ran on; it does
  not prove user-visible behavior. Compare with benchstat across repeated
  runs; -benchmem reports allocations, not escape behavior — combine with
  profiling (source:go:profiling) for the full picture.
