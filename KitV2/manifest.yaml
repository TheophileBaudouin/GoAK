name: go-agent-kit-v2
version: 2.5.0
schema_version: 1
language:
  name: go
  minimum_version: "1.25"
principles:
  - idiomatic-go
  - explicit-errors
  - simplicity
  - concurrency-safe
  - observable-verification
capabilities:
  - rules
  - knowledge
  - recipes
  - snippets
  - templates
  - product-verification
  - pi-workflows
  - go-probes
  - source-registry
  - offline-source-retrieval
  - resource-routing
canonical:
  rules: rules/
  knowledge: knowledge/
  recipes: recipes/
  snippets: snippets/
  templates: templates/
  product-verification: probes/
  pi-workflows: .pi/
  go-probes: probes/
  source-registry: knowledge/
  offline-source-retrieval: tools/offline/
  resource-routing: router/
product_status: standalone
metadata_role: product manifest, not a Pi instruction entrypoint
avoid:
  - duplicated-sources
  - unnecessary-frameworks
  - premature-abstraction
  - unverified-completion
