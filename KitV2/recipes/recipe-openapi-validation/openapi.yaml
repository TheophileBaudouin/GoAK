openapi: 3.0.3
info:
  title: Kit OpenAPI validation example
  version: 1.0.0
paths:
  /widgets:
    post:
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
      responses:
        '201':
          description: Widget created
          content:
            application/json:
              schema:
                type: object
                required: [id]
                additionalProperties: false
                properties:
                  id:
                    type: integer
        '400':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
  responses:
    Error:
      description: Contract-safe error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
